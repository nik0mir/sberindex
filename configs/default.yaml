      confirmed: "В среднем по трём показателям Росстата и ФНС, на которых сверку с соседями до записи правил не считали (оборот общепита, доход по 5-НДФЛ и отгрузка, изменение 2023 → 2024), и по рознице, где гипотеза родилась, у МО типов 3–4 соседи по своему региону ближе похожих по тратам МО других регионов реже, чем у типов 1–2: {share_hi} против {share_lo} случаев (разность {delta}, 95% интервал {ci}, перестановки типов внутри регионов p = {p})."
