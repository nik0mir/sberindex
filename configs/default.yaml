                            # регионам и МО сбалансированным назначением по квадрату расстояния.
                            # Подбор 30.09 по сетке cell_km 30…60 × radius_factor 0,9/0,95/1 × max_edge_km 1200/2500
                            # (правило записано до подбора: ни один регион не разорван; ширина карты не больше
                            # 100 ячеек — ячейка ≥ 8 px в колонке 800 px; затем наименьшее медианное смещение):
                            # 30.09, порция 3: правило исполнено буквально (перепроверка аудитора): допустимых наборов
                            # 21 из 42, минимум медианы — 40 / 0,95 / 2500: медиана 407,6 км, 90% — 655, макс. 2613,
