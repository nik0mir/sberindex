      pessimistic: "одна и та же розница на трёх покрытиях (исходы целей совпадают полностью): SD Δ ≈ 0,037, мощность 0,67 / 0,44 / 0,22, mde ≈ 0,10; Δ_status — SD ≈ 0,037, 0,66 / 0,43 / 0,22. Это хуже одной отгрузки (SD 0,033): покрытие общепита добавляет шум"
      optimistic: "исходы трёх целей независимы (SD отдельных Δ 0,045 / 0,039 / 0,033): SD Δ ≈ 0,023, мощность около 0,97 / 0,83 / 0,50, mde ≈ 0,063"
      lowest_verdict: "правило наименьшего вердикта снижает мощность ещё: по рознице на тех же покрытиях основной расчёт и вариант без уровня трат — confirmed, а другое правило рёбер (−0,054) и районы отдельно (−0,039) — not. Повторы seed дают те же метки, что основной расчёт, и мощность не снижают; решают два варианта R1"
      note: "насколько исходы трёх целей у одного МО связаны, до расчёта неизвестно; разность −0,088 завышена отбором (гипотеза из неё родилась). Реалистично — not самый вероятный исход"
    words:                    # поля: {delta}, {ci}, {p}, {mde}, {delta_status}, {ci_status}, {delta_go}, {ci_go},
