      confirmed:
        status_adds: "Совет уточняется типом, в пределах проверенного: «Сверяйте со своим регионом. Для МО типов 3–4 перевес своего региона по изменению розницы, общепита, доходов и отгрузки за 2023 → 2024 меньше — полезно посмотреть и на похожие по тратам МО других регионов». В карточке МО типов 3–4 рядом с соседями по региону — список похожих по тратам МО других регионов (набор D, node_comparable.csv) с этой подписью; у типов 1–2 карточка не меняется. В §8 — подраздел с проверкой, мощностью и описанием по целям; в §1 — одна фраза. «Польза — от региона, а не от типов» → «польза — от региона; тип подсказывает, когда одного региона мало»"
        status_same: "Совет «Сверяйте со своим регионом» не уточняется типом; в §8 — confirmed с текстом status_same; «польза — от региона, а не от типов» остаётся. Только при go_below: подпись в карточке городских округов «у городских округов перевес своего региона меньше» и фраза status_same_go"
        share_hi_more_often: "Перекрывает status_adds и status_same: совет не уточняется ни типом, ни статусом; в §8 добавляется «у типов 3–4 перевес своего региона меньше ({share_hi} против {share_lo}), но и у них соседи по региону ближе чаще, чем нет»; карточка не меняется"
      not: "Совет и карточка не меняются. В §8 — подраздел «Зависит ли польза от типа» с текстом not, {mde} и описанием по целям; в §9 — «эта проверка не дала оснований менять совет по типу». Фраза «у типов 3 и 4 — примерно в половине случаев» (§9) остаётся с пометкой «по рознице; на трёх других показателях не повторилось». При go_below — текст not_go_below в §8, на сайте — нет"
      reverse: "Совет и карточка не меняются. В §8 — текст reverse; доли по типам по рознице показываются только вместе с ним"
      unstable: "Главный текст — по наименьшему вердикту; в разделе проверки — числа основного расчёта с текстом unstable"
    negative_control:
      type_permutation: "метки типов перемешиваются внутри групп региона, одни и те же для трёх целей: если сам состав регионов создаёт разность, нуль сместится, и поправка center сделает вердикт строже; по рознице на трёх покрытиях нуль −0,004 при SD 0,029"
      placebo_target: "нет: цели, на которую тип заведомо не может влиять, у нас нет; отгрузка — лишь далёкая от оси цель"
    flag_meaning: "Тип 1 устойчив лишь у 7,8% узлов, и при другом правиле рёбер 37% его МО переходят в типы 3–4, поэтому проверяется деление на две группы {1,2} / {3,4} (совпадает во всех вариантах у 80,5% МО), а не четыре типа; доли по отдельным типам — описание; устойчивость к вариантам — через lowest_verdict. В карточке совет для МО с флагом «тип зависит от варианта расчёта» сопровождается этим флагом"
    limitations:
      - "Один переход 2023 → 2024: исход — про сверку за этот год, не про опережающую оценку"
      - "Две группы типов, не четыре; даже confirmed со «сверх статуса» — скромный вывод про две группы и один год"
      - "Номинальные рубли: инфляция общая для B и D, но в разности ошибок сокращается не полностью"
      - "Без МСП (общепит и отгрузка): крупные и средние предприятия; изменения отражают и смену состава отчитывающихся. Доход 5-НДФЛ — по месту работодателя"
      - "Отбор по покрытию: у каждой цели свой набор МО (828 / 1231 / 1541); по общепиту вывод — о МО, где оборот публикуется"
      - "Наборы тоньше: медианный размер B и D по общепиту 8 и 7 против 10 и 10 по рознице"
      - "Мощность: исход not не доказывает отсутствия разницы — порог обнаружения {mde}; правило наименьшего вердикта снижает её ещё (по рознице оно дало бы not)"
      - "Три цели зависимы (одни МО, одни метки), поэтому среднее — одна проверка, а не три"
      - "Интервалы бутстрапа по группам региона не учитывают общих членов D из чужих регионов (как usefulness)"
    circularity: "Ни одна из трёх целей не входит в X и G; тип — по окну 2023 года, цели — изменение к 2024 году. Уровень общепита по типам известен (T1, T4, T5) — это причина выбора, а не круговая проверка: проверяется не различие уровня по типам, а то, с кем сверка точнее. Доход 5-НДФЛ связан с log_wage_rel из X и уровнем трат (уровень; seen_before: t6.coverage_eps2, network.attributes.check, С6), цель же — его изменение 2023 → 2024, которое не смотрели. Маски пропусков всех трёх целей входят в coverage_class T5 — известно, у кого показатель есть, но не его значения"
    qc:
      recompute_retail: 1.0e-12   # тем же кодом на рознице (все 1542 МО) Δ должна совпасть с точным значением из
                              # счётчиков usefulness facts.json rule.by_type: (w3 + w4)/(n3 + n4) − (w1 + w2)/(n1 + n2)
                              # = −0,08779 — иначе код 3
      spec_frozen: true       # ключи блока сверяются с записанными (как usefulness.EXPECTED), иначе код 3

# ПРЕДРЕГИСТРАЦИЯ 30.09.2026 (до настоящего прогона этапа 5). Этап 6 — лендинг и PDF: `python -m munnet site`,
# код — src/munnet/landing.py, выходы — site/ и report/munnet_landing.pdf, спецификация — docs/landing_spec.md.
# Записано до того, как кто-либо увидел настоящие результаты этапа 5: outputs/interpret не существует, слепой прогон
# (outputs/interpret_blind) для этого блока не открывался. Здесь — короткие заголовки по исходам проверок, запрещённые
# слова, правило палитры и формы графиков по вердиктам, правило раскладки «по сходству трат», что лендинг показывает
# при любом исходе, и коды выхода. Правило участника: «всё объективно, подгонять нельзя» — если исход не нравится,
# меняется не заголовок, а ничего; заголовок говорит не больше, чем текст исхода в interpret.tests.*.outcomes.
# Менять блок после вскрытия результатов — только с записью в docs/landing_spec.md (что, когда, почему и что дало бы
# исходное правило). Технические параметры сборки (решётка ячеек, упрощение полигонов, PDF) — не предрегистрация:
# их добавит landing.py отдельным подблоком с пометкой «НЕ ПРЕДРЕГИСТРАЦИЯ».
site:
  verdicts: facts.verdicts_final   # вердикты — из outputs/interpret/facts.json после R1 (interpret.robustness.main_text)
                            # и потолка interpret.thesis_assembly.t1_cap_by_t5; страница читает только флаги view
  headlines:                # короткие заголовки по исходам; ключи — уровни interpret.tests.<тест>.rule.levels
    check:                  # проверка кодом (иначе код 3), на всех сочетаниях вердиктов — и в тесте, и при сборке
      slots: subset_of_text # поля {…} заголовка — только те, что есть в тексте того же исхода; значения — те же,
                            # что подставил этап 5 (labels.TURNOVER_GEN, SET_NAMES, direction_words); поле в начале
                            # заголовка — с прописной буквы (labels.cap)
      slot_order: same_as_text   # поля заголовка идут в том же порядке, что в тексте исхода (подпоследовательность):
                            # обмен {passed_set} / {failed_set} или {n_up} / {n_down} — нарушение (devils-advocate, 30.09)
      digits: slots_or_text # цифра или «%» вне полей {…} — только если та же последовательность есть в тексте исхода
                            # (без полей): «на 50% точнее», «— 100% МО» — нарушение (devils-advocate, круг 6, 30.09)
      comparative_object:   # объект сравнения не переставляется: первое значимое слово или поле после сравнительной
                            # степени (без skip, short_words.stop и polarity.negators) должно стоять после того же слова
                            # и в тексте исхода; «соседи … точнее, чем {set_name}» при тексте «{set_name} … точнее,
                            # чем соседи» — нарушение. Слово — по основе (stems), поле — то же поле
        words: [точнее, чаще, сильнее, быстрее, лучше, хуже, больше, меньше, слабее, реже]
        skip: [чем]
      stems:               # «не больше текста»: значимые слова заголовка должны встречаться в тексте исхода
        min_len: 5          # значимое слово — от 5 букв (после удаления полей {…} из заголовка и текста)
        cut: 2              # основа — слово без 2 последних букв, но не короче min_stem
        min_stem: 4
        normalize: [lower, yo_to_e]   # сравнение без регистра, ё = е; основа ищется подстрокой в тексте исхода
      short_words:          # слова короче stems.min_len тоже «не больше текста»: вне закрытого стоп-списка слово
                            # должно встретиться в тексте исхода («реже», «хуже», «лишь», «все», «уже», «с»).
                            # До 3 букв — то же слово; 4 буквы — слово текста с теми же первыми тремя буквами.
                            # Отрицатели (polarity.negators) проверяет polarity. Список закрыт: правка — до коммита
        stop: [и, в, на, над, по, к, о, за, из, от, до, при, для, а, но, же, то, это, их, них, чем, как, у, что, год]
        prefix_from: 4
      allow: [муниципалит]  # headlines_allow: слово для читателя вместо «МО» (docs/landing_spec.md, §1); больше ничего
      numerals: plural_ru   # слово после числа — по правилу русского числительного (муниципалитет / -а / -ов)
      glossary:             # замены жаргона текста исхода словами для читателя: фраза заголовка засчитывается, только
                            # если в тексте исхода есть одна из её основ; перед проверкой stems фраза из заголовка
                            # удаляется. Словарь закрыт: новая замена — только правкой этого списка до коммита
        "при том же размере и доле горожан": [страт размера и доли горожан]
        "плацебо": [плацебо, псевдогод]   # один термин для читателя; объяснён один раз в reliability_grammar.key
      polarity:             # отрицание не выпадает и не добавляется (иначе код 3). Слово отрицается, если перед ним
                            # стоит одно из negators; поиск — после удаления полей {…}, без регистра, ё = е
        negators: [не, ни, без]   # «без»: «С ограничением» вместо «Без ограничения» — нарушение
        any_length_if_negated: true   # полярность проверяется у слова любой длины, если перед ним отрицатель
                            # («не чаще»); без отрицателя — у слов от stems.min_len (короткие — short_words)
        standalone: [нет, ничего]   # в заголовке — только если есть в тексте исхода
        same_polarity: true # (1) основа с отрицанием в заголовке — с отрицанием и в тексте; (2) основа без отрицания
                            # в заголовке хотя бы раз стоит без отрицания в тексте
        verdict_negations: [не доказ, не отлича, не упорядоч, не лучше, не подтвержд, не сильнее, не точнее,
                            не повторя, ничего не добавля, "— нет"]
        require_if_in_text: true   # есть в основном тексте исхода хоть одна из verdict_negations — в заголовке
                            # хотя бы одна из них, и только из тех, что есть в тексте. Основной текст — outcomes.<>.text;
                            # вставки other_overall / other_none T1 partial_one — о втором обороте, в правило не входят
      quantifiers: [любо, всех, всегда, никогда, каждо]   # квантор в заголовке — только вместе со следующим словом:
                            # пара основ «квантор + слово» должна стоять рядом и в тексте исхода («любого деления»
                            # при тексте «любого из этих делений» — нарушение)
      must_keep:            # оговорки и поля, которые обязаны остаться в заголовке; «|» — любая из основ. Отсутствие —
                            # код 3. Проверяется на заголовке до подстановки полей
        T1_ladder_external:
          confirmed: ["при том же размере и доле горожан", жител, Росстат]
          partial_one: ["при том же размере и доле горожан", "{turnover_beyond}", Росстат]
          partial_overall: ["{turnovers_overall}", в целом, не доказ]
          not: [не упорядоч, в целом, Росстат]
        T2_direction:
          confirmed: [плацебо, надёжн]
          partial_capped: [плацебо, надёжн, границ]
          partial: [плацебо, не доказ]
          not: [плацебо, не доказ]
          down: [плацебо, надёжн]
        T3_reliable_placebo:
          confirmed: [плацебо, "{excess_ci}"]
          partial: ["{placebo_median}"]
          not: [плацебо, не отлича]
        T4_basket_vs_place: {describe: [Описание]}
        T5_trivial:
          confirmed: [не повторя, "{turnovers}", "при том же размере и доле горожан", Росстат]
          partial: ["{turnovers}", "при том же размере и доле горожан", "{max_partition}", Росстат]
          not_empty: [не подтвержд, Росстат]
          not_repeats: ["{max_partition}", не сильнее, Росстат]
        T6_bank_coverage:
          confirmed: [надёжно перешедших, "{flows}", оставш, исходного, Росстат]   # только МО потоков movers
          partial: [надёжно перешедших, "{flows}", слабо, Росстат]
          not: [надёжно перешедших, "{flows}", "— нет", Росстат]
        T6_caveat: {caveat: [частично]}
        T7_utility:
          confirmed: [при сверке, тот же период, других регионов, сосед]   # сверка за тот же период, не прогноз
          partial: ["{passed_set}", не точнее, ориентир]
          not: [не лучше]
        T7_type_gain: {adds: [уточня], neutral: [ничего не добавля], hurts: [точнее]}
      negative_control:     # плохие заголовки, которые проверка обязана поймать (тест этапа site, иначе проверка сломана)
        - {test: T1_ladder_external, key: partial_overall, h: "Типы упорядочены по обороту {turnovers_overall} сильнее делений без типов"}
        - {test: T3_reliable_placebo, key: not, h: "Число смен типа за год отличается от плацебо"}
        - {test: T2_direction, key: not, h: "Отличие переходов вверх и вниз от плацебо доказано"}
        - {test: T1_ladder_external, key: partial_one, h: "От села к городу"}
        - {test: T2_direction, key: down, h: "Переходы чаще идут вниз по порядку типов"}
        - {test: T2_direction, key: partial_capped, h: "Переходы чаще идут {direction}; часть из них — пограничные муниципалитеты"}
        - {test: T5_trivial, key: confirmed, h: "Типы не повторяют размер и долю горожан и различаются по обороту сильнее любого деления"}
        - {test: T1_ladder_external, key: partial_one, h: "По обороту {turnover_beyond} типы упорядочены сильнее любого деления без типов"}
        - {test: T6_bank_coverage, key: confirmed, h: "Сдвиг виден и вне данных банка: оборот общепита у перешедших рос быстрее"}
        - {test: T7_utility, key: confirmed, h: "{set_name} из других регионов предсказывают изменение розничного оборота точнее соседей"}
        - {test: T3_reliable_placebo, key: confirmed, h: "Сверх плацебо за год тип надёжно сменили {excess} муниципалитетов"}
        - {test: T5_trivial, key: not_repeats, h: "Типы по составу близки к делению «{max_partition}»"}
        - {test: T5_trivial, key: confirmed, h: "Типы не повторяют размер и долю горожан; при том же размере и доле горожан они различаются по обороту {turnovers} Росстата сильнее этих делений — от села к городу"}
        - {test: T3_reliable_placebo, key: confirmed, h: "Надёжных смен типа за год сверх плацебо не больше {excess} (интервал {excess_ci})"}
        # атаки devils-advocate 30.09 (круг 5): короткие слова, «без», отрицание короткого слова, порядок полей
        - {test: T2_direction, key: down, h: "Надёжные переходы идут вниз по порядку типов реже, чем на плацебо"}
        - {test: T2_direction, key: confirmed, h: "Надёжные переходы не чаще идут {direction}, чем на плацебо"}
        - {test: T2_direction, key: not, h: "Надёжных переходов вверх {n_down}, вниз {n_up}; отличие от плацебо не доказано"}
        - {test: T3_reliable_placebo, key: partial, h: "Надёжных переходов {n_reliable}, из них ложных лишь {placebo_median}"}
        - {test: T1_ladder_external, key: not, h: "По обороту общепита и розницы Росстата типы не упорядочены лишь в целом"}
        - {test: T7_type_gain, key: hurts, h: "С ограничением типом подбор точнее"}
        - {test: T7_utility, key: confirmed, h: "При сверке изменения розничного оборота за тот же период {set_name} из других регионов хуже соседей по своему региону"}
        - {test: T7_utility, key: partial, h: "{set_name} — ориентир для сравнения: точнее, чем {failed_set}, но не точнее, чем {passed_set}"}
        # после поправки текстов T6 и T7 до вскрытия (30.09): выпавшие «надёжно … {flows}» и «при сверке за тот же период»
        - {test: T6_bank_coverage, key: confirmed, h: "У перешедших муниципалитетов оборот общепита Росстата на жителя рос быстрее, чем у оставшихся того же исходного типа"}
        - {test: T6_bank_coverage, key: not, h: "Сдвиг {direction} виден в безналичных тратах, в обороте общепита Росстата — нет"}
        - {test: T7_utility, key: confirmed, h: "По изменению розничного оборота {set_name} из других регионов точнее соседей по своему региону"}
        # атаки devils-advocate 30.09 (круг 6): цифры вне полей и перевёрнутый объект сравнения
        - {test: T7_utility, key: confirmed, h: "При сверке изменения розничного оборота за тот же период соседи по своему региону точнее, чем {set_name} из других регионов"}
        - {test: T7_utility, key: confirmed, h: "При сверке изменения розничного оборота за тот же период {set_name} из других регионов на 50% точнее соседей по своему региону"}
        - {test: T6_bank_coverage, key: confirmed, h: "У муниципалитетов, надёжно перешедших {flows}, оборот общепита Росстата на жителя рос быстрее, чем у оставшихся того же исходного типа, — в 2 раза"}
        - {test: T3_reliable_placebo, key: confirmed, h: "Надёжных смен типа за год сверх плацебо: {excess} (интервал {excess_ci}) — 100% МО"}
    screen0: {title: T1_ladder_external, lead: T3_reliable_placebo}   # экран 0: заголовок-утверждение — по T1,
                            # под ним — по T3; ниже дословно вопрос и пункты facts.thesis
    chapters:               # глава -> тест; заголовок главы = заголовок исхода, подзаголовок — второй тест
      types: {title: T5_trivial, note: T4_basket_vs_place}   # глава 3 «Четыре типа»
      order: {title: T1_ladder_external}   # глава 4 «Проверили ли порядок»
      dynamics: {title: T3_reliable_placebo, lead: T2_direction, lead_if: {T3_reliable_placebo: [confirmed, partial]},
                 otherwise: descriptive.dynamics_neutral}   # глава 5; заголовки T2 говорят «надёжные», а при T3 not
                            # «надёжн» в тексте, который пишет сам сайт (заголовки, подписи), запрещено
                            # (forbidden_words.by_verdict) — тогда подзаголовок нейтральный. Дословный текст исхода T2
                            # ниже это слово содержит: тексты этапа 5 не линтуются, а сверяются с facts.json побуквенно
      comparable: {title: T7_utility, lead: T7_type_gain}   # глава 6
      limits: {title: T6_bank_coverage, title_if: {T3_reliable_placebo: [confirmed, partial]},
               otherwise: descriptive.limits_neutral, lead: [descriptive.coverage, T6_caveat]}   # глава 7. Заголовок
                            # T6 говорит «сдвиг» — только если T3 его показал; иначе нейтральный, текст исхода T6 ниже.
                            # Строка coverage — всегда; T6_caveat — только если этап 5 вставил оговорку (ε² > epsilon2_max)
    T1_ladder_external:
      confirmed: "Четыре типа — ступени: оборот общепита и розницы Росстата на жителя растёт от ступени к ступени, в том числе при том же размере и доле горожан"
      partial_one: "При том же размере и доле горожан типы упорядочены по обороту {turnover_beyond} Росстата сильнее делений без типов"
      partial_overall: "Типы упорядочены по обороту {turnovers_overall} Росстата в целом; при том же размере и доле горожан сильнее делений без типов — не доказано"
      not: "По обороту общепита и розницы Росстата типы не упорядочены даже в целом"
    T2_direction:
      confirmed: "Надёжные переходы чаще идут {direction}, чем на плацебо"
      partial_capped: "Надёжные переходы чаще идут {direction}, чем на плацебо; часть из них — муниципалитеты на границе типов"
      partial: "Преобладание переходов {direction} над плацебо не доказано"
      not: "Надёжных переходов вверх {n_up}, вниз {n_down}; отличие от плацебо не доказано"
      down: "Надёжные переходы идут вниз по порядку типов чаще, чем на плацебо"
    T3_reliable_placebo:
      confirmed: "Надёжных смен типа за год сверх плацебо: {excess} (интервал {excess_ci})"
      partial: "Надёжных переходов {n_reliable}, из них ожидаемо ложных ≈ {placebo_median}"
      not: "Число смен типа за год не отличается от плацебо"
    T4_basket_vs_place:     # описание, не проверка; текст — interpret.tests.T4_basket_vs_place.text
      describe: "Описание: итог ближе к разбиению по корзине, чем по признакам места"
    T5_trivial:
      confirmed: "Типы не повторяют размер и долю горожан; при том же размере и доле горожан они различаются по обороту {turnovers} Росстата сильнее этих делений"
      partial: "При том же размере и доле горожан типы различаются по обороту {turnovers} Росстата сильнее делений без типов, но по составу близки к «{max_partition}»"
      not_empty: "Отличие типов — в корзине трат; оборотом Росстата оно не подтверждено"
      not_repeats: "Типы по составу близки к делению «{max_partition}» и по обороту Росстата различаются не сильнее, чем «{best_partition}»"
    T6_bank_coverage:       # показывается как заголовок главы 7 только при T3 confirmed или partial (chapters.limits)
      confirmed: "У муниципалитетов, надёжно перешедших {flows}, оборот общепита Росстата на жителя рос быстрее, чем у оставшихся того же исходного типа"
      partial: "В обороте общепита Росстата на жителя отличие муниципалитетов, надёжно перешедших {flows}, от оставшихся видно слабо"
      not: "У муниципалитетов, надёжно перешедших {flows}, отличие от оставшихся видно в безналичных тратах, в обороте общепита Росстата — нет"
                            # 30.09.2026 до вскрытия: вслед за текстами исходов T6 (поправка в interpret) заголовки
                            # без «сдвиг» и только о МО потоков movers ({flows} — texts.flows_text, как у этапа 5;
                            # «надёжно» и {flows} обязательны — must_keep); было: «Сдвиг виден и вне данных банка: …» /
                            # «В обороте общепита Росстата сдвиг виден слабо» / «Сдвиг виден в безналичных тратах,
                            # в обороте общепита Росстата — нет»
    T6_caveat:              # текст — interpret.tests.T6_bank_coverage.outcomes.caveat; только если этап 5 вставил
                            # оговорку (ε² > T6_bank_coverage.coverage_caveat.epsilon2_max), иначе у заголовка нет текста
      caveat: "Типы частично могут отражать охват безналичной оплаты"
    T7_utility:             # цель T7 — изменение за тот же период, что у самого МО: сверка, не опережение
      confirmed: "При сверке изменения розничного оборота за тот же период {set_name} из других регионов точнее соседей по своему региону"
                            # 30.09.2026 до вскрытия: вслед за текстами исходов T7 (поправка в interpret) — «при сверке
                            # … за тот же период» обязательно (must_keep); было: «По изменению розничного оборота
                            # {set_name} из других регионов точнее соседей по своему региону»
      partial: "{set_name} — ориентир для сравнения: точнее, чем {passed_set}, но не точнее, чем {failed_set}"
      not: "Подбор сопоставимых территорий — описательный инструмент, не лучше соседей по региону"
    T7_type_gain:           # тексты — interpret.tests.T7_utility.outcomes.type_adds / type_neutral / type_hurts
      adds: "Ограничение «того же типа» уточняет подбор"
      neutral: "Тип при подборе ничего не добавляет"
      hurts: "Без ограничения типом подбор точнее"
    descriptive:            # главы без вердикта: интерфейс или факт построения, выводов не содержат; тоже под линтом
      basket: "Что сравниваем: доли трат относительно своего региона"   # глава 1
      similarity: "После снятия регионального фона {share_cross} связей сходства трат соединяют муниципалитеты разных регионов; у случайных пар — {share_cross_random}"
                            # глава 2; share_cross — из network_edges (basket_dist, is_main, same_region); база
                            # share_cross_random = 1 − Σ n_r (n_r − 1) / (N (N − 1)) по размерам регионов узлов сети
                            # (то же определение региона, что у same_region). Оба числа — всегда вместе; на 30.09:
                            # 96,9% против 98,2% (внутри региона 3,1% против 1,8%). Под заголовком — honesty.construction
      limits_neutral: "Оборот общепита Росстата у муниципалитетов, сменивших тип"   # глава 7 при T3 not
      dynamics_neutral: "Куда шли смены типа 2023 → 2024"   # подзаголовок главы 5 при T3 not
      coverage: "Данные — модельная оценка безналичных трат жителей по операциям одного банка; охват банка и доля безналичной оплаты различаются между муниципалитетами"
                            # экран 0 и глава 7 при любом исходе (ловушка 14 munnet-agents), не зависит от ε² T6
      explore: "Найдите свой муниципалитет"   # глава 8
      method: "Как сделано"   # глава 9
      sources: "Источники и лицензии"   # глава 10
  forbidden_words:          # линт текста, который пишет сам этап site: заголовки, роли, строка охвата, интерфейс,
                            # aria-label, alt, подписи и тексты PDF. Дословные тексты facts.texts и facts.thesis этапа 5
                            # не линтуются (их правила — interpret.*.edits; например, описание заместителей T1 говорит
                            # «по ступеням» при любом вердикте), но сверяются с facts.json побуквенно. Поиск — подстрокой
                            # без регистра, ё = е; нарушение — код 3
    unless_in_text:         # в заголовке — только если есть в тексте его исхода (строже правила stems: и короткие слова)
      [ступен, лестниц, городск, город, села, сельск, от села, иерарх, ранг, градиент, каждое десятое,
       каждый десятый, десятое, точнее, сильнее, быстрее, сверх, вверх, вниз, упорядоч, подтвержд, доказ, надёжн,
       сменил, повторя, уточня, пограничн, сдвиг]
    by_verdict:             # в тексте сайта (и в заголовках) — только при этих вердиктах, иначе код 3. Условия одной
                            # строки выполняются все одновременно (И); one_in_ten — флаг вставки этапа 5
      сдвиг: {T3_reliable_placebo: [confirmed, partial]}   # «сдвиг» утверждает, что смены типа есть; при T3 not —
                            # заголовок главы 7 нейтральный (headlines.descriptive.limits_neutral)
      ступен: {T1_ladder_external: [confirmed]}
      лестниц: {T1_ladder_external: [confirmed]}
      к городск: {T1_ladder_external: [confirmed], T2_direction: [confirmed, partial_capped, partial]}
      городской корзин: {T1_ladder_external: [confirmed], T2_direction: [confirmed, partial_capped, partial]}
      каждое десятое: {T3_reliable_placebo: [confirmed], one_in_ten: true}   # и только если этап 5 вставил
                            # {one_in_ten_phrase} (доля избытка в interpret.tests.T3_reliable_placebo.one_in_ten)
      сверх экономики места: {T1_ladder_external: [confirmed, partial_one]}
      сверх места: {T1_ladder_external: [confirmed, partial_one]}
      сильнее экономики места: {T1_ladder_external: [confirmed, partial_one]}
      того же типа: {T7_type_gain: [adds]}
      надёжн: {T3_reliable_placebo: [confirmed, partial]}   # при not любая смена — «в пределах шума»
      сигнал: {T3_reliable_placebo: [confirmed, partial]}
    headlines_always:       # никогда в заголовках и названиях типов (плюс interpret.naming.banned)
      [влия, завис, благодаря, из-за, причин, росси, по стране, всей стране, приезж, туризм, курорт,
       районные центры, жители тратят]
    page_always:            # никогда в тексте сайта
      [регион не определяет, регион не влияет, не зависит от региона, от региона не зависит, регион не важен,
       о россии, по всей россии, по всей стране, главный двигатель, двигател, драйвер, ранний сигнал, реальный рост,
       реальные траты, в реальном выражении, траты × население, тратят приезжие, траты туристов,
       прогноз, предсказ, предскаж]   # T7 сравнивает изменения за один и тот же период — сверка, а не прогноз;
                            # слова остаются только в дословных facts.texts этапа 5
  palette_rule:             # палитра типов и форма графиков — по вердиктам; страница читает флаги view из story.json
    type_palette:
      ordered_if: {T1_ladder_external: confirmed}   # порядковая — только при confirmed (решение участника 30.09)
      ordered: TYPE_PALETTE_ORDERED   # style.py: один оттенок, 4 ступени светлоты по interpret.ladder.order
      nominal: TYPE_PALETTE_NOMINAL   # style.py: на основе Окабе — Ито; при любом другом вердикте T1
      nominal_not_monotone: true   # светлоты (L* CIELAB) номинальной палитры в порядке ladder.order не монотонны —
                            # проверяет код, иначе код 3: светлота не должна подсказывать непроверенный порядок
      audit: scripts/palette_audit.py   # обе палитры — дейтеранопия, протанопия, тританопия, серый — до вёрстки
      shapes: {1: "●", 2: "▲", 3: "■", 4: "◆"}   # фигура — по номеру типа при любом вердикте: порядка не несёт
      not_basket_colors: true   # цвета типов не совпадают с PALETTE частей корзины; полосы корзины — серые
    order_in_legends: {T1_confirmed: ladder, otherwise: size_desc}   # порядок типов в подписях, таблицах, потоках
    t1_chapter_form:        # глава 4 и страница 5 PDF, docs/landing_spec.md §3.6
      layout:               # расстановка типов по вердикту T1
        confirmed: ladder   # типы снизу вверх по ladder.order
        partial_one: ladder
        partial_overall: ladder_place   # подпись «упорядочены так же, как экономика места»
                            # (interpret.tests.T1_ladder_external.outcomes.partial_overall.edits)
        not: columns_by_size   # четыре колонки по размеру, без линий; глава остаётся того же размера
      line_by_turnover:     # стиль линии медиан — по каждому обороту отдельно, по его собственному итогу в facts.t1,
                            # а не по вердикту теста: непрошедший оборот не соединяется линией в порядке ступеней
        beyond_place: solid     # прошёл (a) и (b) со сравнением с делениями без типов
        overall_only: dashed    # прошёл только (a) «в целом»
        failed: pale_points     # не прошёл — бледные точки без линии (reliability_grammar.not)
    t3_flows:               # аллювиальная диаграмма 2023 → 2024 (глава 5) и слой «Смены типа» на карте
      confirmed: {reliable: solid_saturated, noise: pale_hatched, stayed: grey, layer_default: on,
                  layer_name: "Смены типа 2023 → 2024"}
      partial: {reliable: dashed, noise: pale_hatched, stayed: grey, layer_default: on,
                layer_name: "Смены типа 2023 → 2024"}
      not: {reliable: pale_hatched, noise: pale_hatched, stayed: grey, layer_default: off,
            layer_name: "Смены типа в пределах шума"}   # при not и в карточке любая смена — «в пределах шума»
    t2_arrows: [confirmed, partial_capped]   # и T3 confirmed или partial; стрелки и слова направления в главе 5 — только при этих вердиктах
                            # (переходы чаще в одну сторону при обоих разбиениях половин); иначе оси «2023» и «2024»
    reliability_grammar:    # одна на все графики проверок
      passed: solid         # сплошная линия или насыщенная заливка
      partial: dashed       # пунктир
      not: pale_hatched     # бледная заливка со штриховкой
      key: "Сплошная — проверка пройдена, пунктир — пройдена частично, бледное — не отличить от случайности. Плацебо (псевдогоды) — тот же расчёт на «годах», собранных из перемешанных месяцев 2023 и 2024 годов: столько смен типа даёт случайность"
    accent: focus_only      # один тёмно-красный акцент — только выбранное МО или наблюдаемое значение над плацебо
  similarity_layout:        # перестановка «по сходству трат» (глава 2, docs/landing_spec.md §3.3)
    nodes: all_nodes        # все 1776 узлов сети, включая Москву и Петербург
    candidates:
      graph_fr: {graph: network_edges.basket_dist, main_only: true, weights: none, method: fruchterman_reingold,
                 niter: 1000}   # igraph; веса не используются (линии одной толщины); случайность — от seed
      hybrid_pca: {space: interpret.examples.space, components: 2}   # PCA стандартизованного пространства
                            # итогового гибрида (вложение G ⊕ X, как у K-means)
    choose: neighbor_preservation   # доля сохранённых соседей: для узла — |k ближайших на схеме ∩ соседи в основной
                            # сети| / min(k, степень узла), k = n_net_neighbors; среднее по узлам со степенью > 0.
                            # Берётся кандидат с большей долей; при равенстве — первый в candidates. Выбор — только
                            # по этой доле, без взгляда на раскраску типов
    n_net_neighbors: 10
    min_preserved: 0.30     # ПРАВИЛО ПРОЕКТА: у обоих кандидатов доля меньше — перестановки нет, остаются линии
                            # к соседям на карте ячеек; у случайной схемы доля ≈ 10 / 1775 ≈ 0,006. Доля считается
                            # на той же сети, которую укладывает graph_fr, поэтому выгодна ему; это правило выбора
                            # раскладки, а не довод, что типы «настоящие»
    caption: "На схеме сохранено {preserved} соседей по сети; расстояния приблизительны"   # доля — всегда под схемой
    order_marks_if: {T1_ladder_external: [confirmed]}   # оси, стрелки и подписи ступеней на схеме — только при
                            # T1 confirmed; иначе схема без осей и без подписей порядка
  n_similar_shown: 5        # сопоставимых территорий в карточке (набор продукта T7 — A или D по type_gain) из k = 10
  similar_caption: "{n_shown} ближайших из {n_set} — набора, на котором в главе 6 проверялась точность"
  always:                   # показывается при любом исходе проверок
    t7_all_sets: true       # точечный график T7 — набор продукта, соседи по своему региону (B) и случайные того же
                            # размера (C) с интервалами; B — всегда, даже если он точнее
    t5_ami: true            # AMI типов со всеми делениями без типов; при T5 ≠ confirmed рядом карта-соперник
    t3_placebo: true        # облако 200 псевдопар, 95-й перцентиль и наблюдаемое число
    coverage: true          # headlines.descriptive.coverage — на экране 0 и в главе 7 при любом исходе
    t6_caveat: if_inserted  # оговорка T6 — там же, но только если этап 5 вставил её (ε² > epsilon2_max)
    negative_same_size: true   # отрицательный исход занимает то же место, глава не убирается
    mo_stability:           # устойчивость отдельного МО в карточке (решение участника 30.09) — расчёт вне
      label: "описание, не проверка"   # предрегистрации этапа 5, поэтому только с этой подписью
      separate: [rule_variants, seeds]   # «тот же тип в N из 3 вариантов правила рёбер и состава узлов» и «в N из M
                            # повторов с другим seed» — раздельно, в одно «N из 8» не складываются
    honesty:                # подписи под графиками, обязательные
      layout: "Схема и типы построены из одних и тех же данных, поэтому типы на ней разделены по построению; порядок типов на схеме — не доказательство порядка"
      t7_same_period: "Изменения набора и самого муниципалитета — за один и тот же период: это сверка, а не опережающая оценка"
                            # под графиком главы 6 и в главе 9, при любом исходе T7
      construction: "Во многом это следствие построения: траты считаются относительно своего региона, региональный фон снят"
      lines: "Сходство трат, не поездки и не потоки"
      nodata: "Нет типа: ряд трат неполный (меньше 24 месяцев или с пропусками)"
    scope_reader: "Вывод — о {n_nodes} муниципалитетах в {n_regions} регионах (Москва и Петербург — каждый как один город). Ещё {n_untyped} муниципалитетов без типа: ряд трат неполный"
                            # числа выводит код; n_untyped — МО без узла (169 на 30.09), не 2190 − 1776
    sources: true           # под каждым графиком — источник и лицензия
  roles:                    # «Кому и зачем» (глава 6); у роли одно реальное МО по правилу, с регионом
    ministry:
      example: interpret.tests.T7_utility.example   # МО с медианной ошибкой набора продукта, не лучший случай
      confirmed: "Региональному министерству: {set_name} из других регионов — группа для сверки изменения розничного оборота"
      partial: "Региональному министерству: {set_name} из других регионов — ориентир для сравнения динамики"
      not: "Региональному министерству: {set_name} из других регионов — описание, с кем муниципалитет схож по тратам"
    analysts:               # как в преамбуле interpret: утверждение держится на T2 и T3 и без них не делается
      show_if: {T3_reliable_placebo: [confirmed, partial], T2_direction: [confirmed, partial_capped, partial]}   # И
      example: interpret.examples.flows   # первый пример самого большого потока надёжных переходов
      confirmed: "Аналитикам СберИндекса: надёжная смена типа — повод присмотреться к муниципалитету; примерно {placebo_median} из {n_reliable} таких смен дал бы и шум"
      partial: "Аналитикам СберИндекса: надёжная смена типа — повод присмотреться, но выше плацебо она лишь при одном из двух способов разбить год на половины; примерно {placebo_median} из {n_reliable} таких смен дал бы и шум"
      not: null
    business:               # решение участника 30.09: оставить с подписью; опора — этап eda, не T1–T7. Отклонение
                            # от преамбулы interpret («для бизнеса только профили типов») — docs/landing_spec.md, §1
      example: max_pop_reliable_rhythm   # крупнейшее по pop_avg МО с надёжным своим ритмом (features_rhythm)
      text: "Бизнесу: у {n_rhythm} муниципалитетов ({share_rhythm}) свой годовой ритм трат — сверх общего календарного ритма — повторился в 2023 и 2024 годах, при случайно перемешанных месяцах — у {share_rhythm_null}. Ориентир для сезонного персонала и запасов"
                            # n_rhythm — узлы с own_reliable в features_rhythm; share_rhythm и share_rhythm_null —
                            # outputs/eda/facts.json: syn.reliable_share_nodes и syn.null_reliable_share_nodes (та же
                            # база — узлы сети; на 30.09: 17,5% и 1,5%); landing.py сверяет n_rhythm / узлы с share_rhythm
      label: "описание, не проверка"
  budget_mb: {first_screen: 0.3, total: 3.0, hard: 5.0}   # первый экран без fetch; больше hard — код 3.
                            # 30.09, порция 5a: total 2,0 -> 3,0 — страница теперь считается вместе с vendor/
                            # (three.js 0.170.0 и OrbitControls, 0,69 МБ, gzip ≈ 0,18 МБ), которые грузятся после
                            # статичного первого экрана; hard не меняется (docs/landing_spec.md, §4.7)
  exit_codes:               # этап site; 0 — собрано
    1: "нет outputs/interpret/facts.json, его status не done или входы старше data/processed/cluster_labels.parquet"
    3:                      # не прошла проверка — страница не публикуется
      - "слепые выходы: facts.blind не пуст или вход — outputs/interpret_blind"
      - "заголовок не прошёл headlines.check или содержит слово из forbidden_words"
      - "слово из forbidden_words в тексте сайта, пустое поле {…}, глава без заголовка"
      - "контрольные числа (1776 узлов, 169 МО без типа, 247 районов столиц, размеры типов) не совпали с файлами"
      - "номинальная палитра монотонна по ladder.order или бюджет budget_mb.hard превышен"
      - "хеш замороженных ключей site не совпал с freeze.sha256 или negative_control пропустил плохой заголовок"
  demo: {out: outputs/site_demo, banner: "ДЕМО: синтетические данные"}   # --demo: синтетический facts.json,
