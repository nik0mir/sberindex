      not_go_below: "Простое деление «городской округ / остальные МО» даёт разницу ниже нуля ({delta_go}, интервал {ci_go}): у городских округов перевес своего региона меньше, а деление по типам на этих показателях разницы не показало."
      reverse: "В среднем по трём показателям, на которых сверку с соседями до записи правил не считали, у типов 3–4 соседи по региону оказались ближе даже чаще, чем у 1–2 ({share_hi} против {share_lo}, разность {delta}, интервал {ci}, p = {p}): у них перевес своего региона не меньше, а больше, и совет «сверяйте со своим регионом» для них верен тем более. По рознице было наоборот — на этих показателях не повторилось."
      noise_caveat_lo: "Цель у типов 1–2 шумнее (медианная ошибка больше чем в 1,5 раза выше, чем у 3–4: {noise_targets}), а при шумной цели доли стягиваются к 50%; это ослабляет сравнение."
      unstable: "В основном расчёте вердикт выше, чем в части вариантов расчёта типов (правило рёбер, состав узлов или seed); в главный вывод идёт наименьший."
      go_always: "Рядом при любом исходе: деление «городской округ / остальные МО» (mo_type == \"go\") — {delta_go}, интервал {ci_go}."
