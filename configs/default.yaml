# Параметры следующих этапов: стартовые значения, уточняются при реализации (PLAN.md, этапы 1–5).
period:
  start: "2023-01"
  end: "2024-12"

# Узлы сети (src/munnet/nodes.py): что делать с 247 внутригородскими территориями Москвы и Петербурга.
# Ими пользуются этап eda (матрица сюжетов T14 и прототип T15) и этап features. Решение 26.09 — PLAN.md, этап 1.
nodes:
  mode: collapse              # collapse — два узла-города; separate — 247 отдельных узлов (проверка
                              # чувствительности); exclude — без внутригородских территорий
  city_id_base: 90000         # territory_id узла-города = 90000 + код субъекта (90077, 90078): вне номеров
                              # справочника СберИндекса (1…3101), код субъекта виден в номере
  min_pop_coverage: 1.0       # показатель Росстата и ФНС у города — только если он есть у районов с такой
                              # долей населения города; иначе пропуск (частичную сумму не выдаём за город)
  cities:                     # код субъекта -> узел-город
    77:
      name: Москва
      oktmo: "45000000"       # строка «Субъект РФ» 5-НДФЛ: число получателей дохода (сумма районов — двойной счёт)
      region_group: 50        # «относительно региона» — вместе с Московской областью
      outliers: [wage, ndfl]  # зарплата и 5-НДФЛ по месту работодателя (головные офисы): флаг выброса,
                              # доход 5-НДФЛ на жителя не считается
    78:
      name: Санкт-Петербург
      oktmo: "40000000"       # строки «Свод» в 5-НДФЛ нет: получатели — пропуск, ndfl_ok = false
      region_group: 47        # вместе с Ленинградской областью
      outliers: []

# Этап 2. Признаки узлов (python -m munnet features): data/processed/features_*.parquet, outputs/features/.
features:
  min_months: 24              # узел сети — ряд не короче 24 месяцев: признаки 2023 и 2024 годов, переходы типов
                              # и свой ритм считаются на одних узлах (docs/eda.md, раздел 7: полный ряд у 2016
                              # МО, 94,2% населения); 12 — проверка чувствительности, окна без всех месяцев — пропуск
  windows: [year, half, quarter]   # окна признаков корзины: год, полугодие, квартал
  clr_floor: 0.001            # доля части в месяце меньше — мультипликативная замена перед CLR (на данных
                              # 26.09 — одна доля общепита); у годовых и квартальных долей таких нет
  region_center: mean         # центр группы региона для корзины и уровня: mean — среднее CLR (центр
                              # композиций по Эйчисону), median — медиана по координатам с повторным центрированием
  place_center: median        # центр группы для признаков места (*_rel): медиана — устойчиво к выбросам
  context_years: [2023, 2024] # годы признаков экономики места; у 2024 года нет зарплаты в 5 регионах (docs/eda.md)
  rhythm_categories: [all, food, marketplace, transport, health, cafe, other]   # ряды своего ритма для рёбер
  checks:                     # воспроизведение чисел решения о сюжете (PLAN.md, этап 1; черновые скрипты 26.09)
    k: 5                      # типов k-means по корзине относительно региона
    n_init: 20
    seeds: 5                  # чувствительность к seed: seed, seed + 1, … (разброс чисел в checks.json)
    tree_depth: 3             # неглубокое дерево «экономика места -> тип»
    cv_folds: 5
    tree_year: 2023           # год признаков места для дерева (у 2024 года меньше покрытие Росстата)
    tree_features: [log_wage_rel, urban_share_rel, age_old_share_rel, log_pop_rel, market_access_rel,
                    emp_sh_primary, emp_sh_industry, emp_sh_public, emp_sh_market_services,
                    emp_sh_trade_transport, north, dist_capital_km]
    reference:                # воспроизведено конвейером 27.09 (1776 узлов, collapse, seed 42): сверка при
                              # повторных прогонах; расхождение больше допуска — предупреждение в логе, не ошибка
      ami_region: 0.005
      tree_kappa: 0.315
      tree_kappa_clean: 0.121
      ari_years: 0.317
      moved_share: 0.233
      noise_share: 0.077
      offline_2023: 722
      offline_2024: 18
    reference_tol: 0.01       # допуск: |разница| ≤ 0,01 × max(1, |значение|) — 0,01 у долей, 1% у счётчиков
    draft_26_09:              # черновые скрипты 26.09 вне конвейера (1774 МО без внутригородских, свой субъект
                              # вместо группы региона, seed 0) — на них опиралось решение о сюжете; только история
      ami_region: 0.004
      tree_kappa: 0.31
      ari_years: 0.32
      moved_share: 0.228
      noise_share: 0.075
      offline_2023: 720
      offline_2024: 17
  # Пространство признаков для этапа 3 (docs/features.md): роль признака — где он используется, чтобы один
  # и тот же сигнал не вошёл дважды (в рёбра и в атрибуты). Выбор проверяется на данных правилами ниже,
  # итог проверки — колонка «Проверка» в docs/features.md.
  space:
    edges: [clr_rel_food, clr_rel_marketplace, clr_rel_transport, clr_rel_health, clr_rel_cafe, clr_rel_other]
                              # рёбра: корзина относительно группы региона (правило basket_dist, docs/network.md)
    attributes: [log_level_rel, log_wage_rel, urban_share_rel, age_old_share_rel, log_pop_rel,
                 market_access_rel, emp_sh_primary, emp_sh_industry, emp_sh_trade_transport,
                 emp_sh_market_services, emp_sh_public]
                              # атрибуты узлов: уровень трат и экономика места
    layer: [own_summer, own_amplitude_shrunk]   # слой: северный годовой ритм; региональный по природе (Север),
                              # поэтому проверяется только надёжность, а не η² группы региона
    dynamics: [sh_marketplace, mp_pp_yoy]   # сдвиг к маркетплейсам: между окнами (этап dynamics), не атрибут
    min_reliability: 0.5      # признак с надёжностью 2023 ~ 2024 ниже — описательный, не атрибут
    max_abs_rho: 0.8          # |ρ| Спирмена двух признаков одной роли выше — пара почти дублирует друг друга
    duplicate_rho: 0.999      # |ρ| выше — ранги совпадают, признаки взаимозаменяемы: оставить один
  report: docs/features.md    # отчёт этапа features (собирается кодом, руками не править)
  report_strict: true         # утверждение шаблона отчёта неверно на данных — ошибка (код 3), отчёт не пишется

# Этап 2. Правила рёбер и сеть (python -m munnet network): data/processed/network_*.parquet, outputs/network/,
# отчёт docs/network.md. Формулы правил — в src/munnet/network/rules.py и в отчёте.
network:
  # Правила рёбер: имя -> вид и параметры. Сходство S_ij пары узлов, больше — ближе.
  rules:
    basket_cos:          # косинус векторов корзины: CLR шести долей за окно минус центр группы региона
      kind: basket_cosine
    basket_dist:         # то же пространство, расстояние Эйчисона d = ‖s_i − s_j‖ и ядро exp(−d²/σ²)
      kind: basket_distance
    rhythm_corr:         # корреляция Пирсона своего ритма (после тренда узла и общего ритма месяца)
      kind: rhythm_corr
    rhythm_corr_all:     # вариант: только ряд «Все категории» (не кандидат; показывает, что даёт среднее
      kind: rhythm_corr  # по шести частям корзины)
      categories: [all]
    rhythm_lag:          # максимум корреляции своего ритма по сдвигам |ℓ| ≤ max_lag
      kind: rhythm_lag
      max_lag: 3
    rhythm_dtw:          # DTW z-нормированного своего ритма с окном Сакоэ — Чибы, ядро exp(−d²/σ²)
      kind: rhythm_dtw
      window: 2          # допустимый сдвиг, месяцев (dtaidistance: параметр window = сдвиг + 1)
    basket_dist_abs:     # абляция: расстояние корзин без вычета центра региона (CLR как есть) — сколько
      kind: basket_distance  # «отличия от географии» даёт само вычитание региона
      relative: false
      ablation: true
    rhythm_corr_rel:     # абляция: корреляция ритма после вычета среднего ритма группы региона в каждом месяце
      kind: rhythm_corr
      relative: true
      ablation: true
    geo_road:            # контроль «чистой географии»: дорожное расстояние (highway), ядро exp(−d²/σ²)
      kind: road
    geo_gravity:         # контроль: гравитация P_i·P_j / d^β, P — население, d — дорожное расстояние
      kind: gravity
      beta: 2.0
      min_km: 1.0        # у части пар МО дорожное расстояние 0 (общий центр): снизу ограничено
  rhythm_categories: [food, marketplace, transport, health, cafe, other]   # ряды своего ритма для rhythm_*
                             # по умолчанию (правило может задать свои categories): шесть частей корзины;
                             # корреляция — среднее корреляций по категориям (= корреляция сцепленных
                             # z-рядов), у лагов сдвиг общий для всех категорий пары, DTW — среднее
                             # расстояний по категориям
  spearman_check: true       # rhythm_corr: Спирмен вместо Пирсона — проверка на выбросы (Жаккар рёбер)
  city_distance: pop_mean    # расстояние от узла-города: pop_mean — среднее по районам с весами населения,
                             # min — до ближайшего района
  period: all                # окно сравнения правил: all — 24 месяца; надёжность — сети 2023 против 2024
  sparsify:
    method: knn              # основное разрежение: knn (объединение списков) | mutual_knn | threshold
    k: 10
    k_grid: [5, 10, 15, 20]  # чувствительность к k — обязательно
    fdr_q: 0.05              # threshold для правил по рядам: Бенджамини — Хохберг против циклического сдвига
  nulls:                     # нулевые модели
    shift_repeats: 5         # повторов циклического сдвига: нулевое распределение сходства пар рядов
    shift_guard: 2           # сдвиг s допустим, если |s| mod 12 дальше от 0 и 12 на досягаемость правила
                             # (лаг L, окно DTW w, у корреляции 0) плюс guard: сезон не совпадает
    rewire_repeats: 10       # перемешиваний рёбер с сохранением степеней: нуль модульности
    rewire_factor: 10        # перестановок на ребро при перемешивании
    mantel_permutations: 49  # перестановок узлов: значимость ранговой корреляции сходств двух правил
    naive_r: 0.5             # «наивный» порог по r без поправки: сколько пар он пропускает в данных и на нуле
  bootstrap: 20              # бутстрап месяцев (корзина, корреляция): Жаккар с сетью на всех месяцах
  probe:                     # фиксированный зонд кластеров: Leiden, модульность, одно разрешение
    resolution: 1.0
    seeds: 10
  attributes:                # согласованность рёбер с экономикой места (не участвует ни в одном правиле)
    year: 2023               # у 2024 года нет зарплаты в 5 регионах
    columns: [log_wage_rel, urban_share_rel, age_old_share_rel, log_pop_rel, market_access_rel,
              emp_sh_primary, emp_sh_industry, emp_sh_trade_transport, emp_sh_market_services, emp_sh_public]
    relative: [emp_sh_primary, emp_sh_industry, emp_sh_trade_transport, emp_sh_market_services, emp_sh_public]
                             # эти берутся относительно группы региона (минус медиана группы), как *_rel
    check: [log_ndfl_rel]    # проверка на признаке вне пространства атрибутов этапа 3 (features.space): доход
                             # 5-НДФЛ на жителя относительно группы региона, только узлы с ndfl_ok; не входит
                             # в среднюю согласованность и в выбор — защита от замкнутости
    check_permutations: 200  # перестановок значений признака по узлам: случайный уровень ассортативности
    check_residual_on: log_wage_rel   # доход 5-НДФЛ тесно связан с зарплатой (тоже по месту работодателя):
                             # проверка повторяется на остатке МНК проверочного признака на этот атрибут
  # Выбор основного правила. Порядок критериев записан в конфиге; независимой отметки времени до расчёта нет
  # (в git конфиг и результаты попали в один коммит). Основной набор (priority):
  # 1) надёжность — Жаккар рёбер kNN сетей 2023 и 2024 годов, больше — лучше;
  # 2) отличие от географии — 1 − Жаккар с сетью geo_road, больше — лучше;
  # 3) согласованность с атрибутами места — средняя ассортативность по attributes.columns, больше — лучше;
  # 4) простота — ранг simplicity, меньше — лучше.
  # Правило: Парето-фронт с допуском ничьей, на фронте — лексикографически по priority (равные в пределах
  # допуска переходят к следующему критерию); чувствительность — все порядки критериев, сумма рангов (Борда)
  # и другие наборы критериев (sets). Кандидаты — только правила по тратам (geo_* — контроль, абляции — нет).
  selection:
    priority: [reliability, geo_difference, attribute_consistency, simplicity]
    sets:                    # другие разумные наборы (выбор показывается при каждом): modularity — модульность
                             # Leiden сверх нуля с теми же степенями, probe_stability — ARI разбиений разных seed
      plan: [reliability, modularity, attribute_consistency]   # PLAN.md: устойчивость, модульность, согласованность
      extended: [reliability, geo_difference, attribute_consistency, simplicity, modularity, probe_stability]
    tie: bootstrap_sd        # допуск ничьей (добавлен 27.09 после замечания судьи): разница критерия меньше его
                             # стандартного отклонения по бутстрапу месяцев (медиана по правилам, где бутстрап
                             # допустим: корзина и корреляция) — ничья; у простоты допуска нет
    candidates: [basket_cos, basket_dist, rhythm_corr, rhythm_lag, rhythm_dtw]
    simplicity: {basket_cos: 1, basket_dist: 1, rhythm_corr: 1, rhythm_lag: 2, rhythm_dtw: 3,
                 geo_road: 1, geo_gravity: 2}
  modes: [separate]          # режимы узлов для сравнения с основным (nodes.mode): сеть на 247 районах
  dynamics:                  # последовательность окон для выбранного правила (этап 3 кластеризует её)
    kinds: [quarter, half, rolling]   # виды окон; rolling — dynamics.window_months и dynamics.step_months
    main_kind: rolling       # основная последовательность — скользящие 12 месяцев: в каждом окне все
                             # календарные месяцы, сезонный состав корзины не смешивается со сдвигом типов;
                             # кварталы и полугодия — проверка (сезон у соседних окон разный)
    lengths: [3, 6, 12]      # шум против изменения при окне L месяцев: сети на нечётных и чётных месяцах
                             # отрезка 2L (одно время — разница только шум) против сетей двух соседних окон
                             # по L месяцев того же отрезка (шум плюс изменение)
    min_series_months: 12    # правила по рядам — только в окнах не короче (корреляция по 3 точкам — шум)
  report: docs/network.md
  report_images: docs/img/network

# Этап 3. Кластеризация (python -m munnet cluster) и динамика типов (python -m munnet dynamics).
# ПРЕДРЕГИСТРАЦИЯ 28.09.2026: блоки clustering, icvi и dynamics.tracking записаны отдельным коммитом до любых
# расчётов этапа 3 на данных — состав кандидатов, правило выбора числа типов и итогового метода, проверки
# чувствительности, внешняя проверка типов с ожидаемыми знаками, правило «изменение сверх шума». Урок этапа 2:
# объявление в одном коммите с результатами не доказывает, что оно было раньше. Менять эти блоки после расчётов —
# только с записью в отчёте этапа: что изменено, когда, почему и что дало бы исходное правило. Параметры, которые
# этап добавит сам (синтетика, детали реализации), в предрегистрацию не входят.
clustering:
  inputs:                   # одни входы для всех методов: атрибутированная сеть (G, X) этапа 2, 1776 узлов
    graph: {rule: basket_dist, sparsify: knn, k: 10}   # G — сеть корзины относительно региона (docs/network.md)
    features: attributes    # X — features.space.attributes: уровень трат и экономика места, 11 признаков
    place_year: 2023        # год признаков места (у 2024 года нет зарплаты в 5 регионах); уровень трат —
                            # за 24 месяца, как корзина в G
    scale: robust           # X: (x − медиана) / (MAD × 1,4826) по узлам
    impute: region_median   # пропуск признака — медиана группы региона (у признаков *_rel это 0)
  n_clusters: [3, 12]       # сетка числа типов K — одна для всех методов (записана 25.09 в каркасе)
  # Три семейства и базовая линия. Что видит метод: X — только признаки, G — только граф, оба источника.
  families:
    features: [kmeans, ward, gmm, hdbscan]        # по X
    graph: [leiden, louvain, spectral]            # по G
    attributed: [shalileh_mirkin, hybrid]         # по X и G. Метод Шалилеха и Миркина для сетей с признаками
                            # (SEFNAC, PLoS ONE, 2021, или KEFRiN, Entropy, 2022: вариант и его веса — по статье,
                            # фиксируются до запуска на данных); гибрид — спектральное вложение G размерности K
                            # (нормированный лапласиан) ⊕ X, K-means
                            # ПОПРАВКА 29.09 (не предрегистрация, текст выше не меняется): SEFNAC — Complex
                            # Networks & Their Applications IX, Springer, 2021 (SCI 943), с. 3–14,
                            # doi:10.1007/978-3-030-65347-7_1; в PLoS ONE, 2021, 16(7), e0254377
                            # (doi:10.1371/journal.pone.0254377) — ICESi; KEFRiN — doi:10.3390/e24050626
    fusion: [kmeans_joint]  # базовая линия «без графа»: K-means по координатам корзины (features.space.edges)
                            # ⊕ X, у двух блоков равный суммарный вес; отвечает на вопрос, нужен ли граф
  final_eligible: [attributed, fusion]   # итоговая типология — из методов, видящих оба источника: сюжет — типы
                            # по корзине и экономике места (PLAN.md, этап 1). Методы одного источника — базовые
                            # линии; победитель без этого ограничения показывается как проверка
  protocol:                 # равные условия
    tuned: k_only           # подбирается только то, что задаёт число типов: K; разрешение Leiden и Louvain;
                            # min_cluster_size HDBSCAN. Остальные параметры фиксируются до расчёта (по статье
                            # или по умолчанию библиотеки) и пишутся в конфиг
    grid_size: 10           # значений на метод: K = 3…12; сетки Leiden, Louvain и HDBSCAN подбираются только
                            # по получившемуся K (без критериев выбора), чтобы покрыть 3–12
    seeds: 10               # методы со случайностью: seed … seed + 9; итог — по собственному критерию метода
                            # (инерция K-means, правдоподобие GMM, модульность Leiden и Louvain), иначе медоид
                            # по ARI; разброс по seed — в таблицу
    hybrid_alpha: 0.5       # вес графа в гибриде фиксирован заранее (блоки равны); кривая по alpha — анализ
    alpha_curve: [0.0, 0.25, 0.5, 0.75, 1.0]      # «когда помогает граф» на данных; в выбор не входит
  feasible:                 # допустимое разбиение; недопустимое — только в таблице сравнения
    k_range: [3, 12]
    min_cluster_share: 0.02 # наименьший тип — не меньше 2% узлов (36 из 1776): его можно описать и проверить;
                            # если допустимых нет ни у одного метода — 0,01 с записью в отчёт
    max_cluster_share: 0.5  # крупнейший тип — не больше половины узлов
    max_noise_share: 0.1    # HDBSCAN: шум не больше 10%, иначе у каждого десятого МО нет типа
  # Выбор. Одно правило на двух уровнях: сначала внутри метода — число типов K (или параметр, задающий K),
  # затем между методами, каждый со своим K. Критерии — на всех узлах основного режима.
  selection:
    criteria:               # критерий -> направление
      quality_features: max # качество в X: для SW, CH, S_Dbw — z-оценка против случайного базиса (icvi) со знаком
                            # по направлению метрики; критерий — средний по трём метрикам ранг кандидата среди
                            # сравниваемых (0 — худший, 1 — лучший)
      quality_graph: max    # качество на G: то же для AVI, AVU, MQ
      stability: max        # средний ARI разбиения на всех узлах с разбиениями бутстрап-выборок узлов
      interpretability: max # каппа Коэна неглубокого дерева «входы узла -> тип» на перекрёстной проверке
    tie:                    # допуск ничьей: разница меньше — равны
      quality_features: 0.0
      quality_graph: 0.0
      stability: 0.02
      interpretability: 0.02
    rule: pareto_copeland   # 1) Парето-фронт с допуском среди допустимых; 2) на фронте — Копленд: A обходит B,
                            # если A лучше B сверх допуска по большему числу критериев, чем B лучше A;
                            # очки = победы − поражения; 3) равенство очков — выше stability, затем проще
                            # (simplicity), затем меньше K
    simplicity: {kmeans: 1, ward: 1, kmeans_joint: 1, leiden: 1, louvain: 1, gmm: 2, hdbscan: 2, spectral: 2,
                 hybrid: 2, shalileh_mirkin: 3}
    sensitivity:            # считаются всегда; смена победителя пишется в отчёт с объяснением, правило не меняется
      aggregators: [borda, lexicographic_all_orders, copeland_all]   # сумма мест; все 24 порядка критериев;
                            # Копленд по всем допустимым, а не только по фронту
      sets:                 # другие наборы критериев
        icvi_only: [quality_features, quality_graph]
        plan: [quality_features, quality_graph, stability]   # PLAN.md, этап 3: ICVI и устойчивость (бутстрап, ARI)
      tie_scale: [0, 2]     # допуски ничьей × 0 и × 2
      joint: true           # один шаг по всем парам «метод, K» вместо двух
      all_eligible: true    # победитель, если допускаются все семейства
      variants:             # пересчёт на других входах (PLAN.md, этап 3); сравнение — ARI с основным победителем
        graph_basket_cos: {graph_rule: basket_cos}    # вторая сеть корзины — косинус (ARI сообществ с основной 0,32)
        no_level: {drop_features: [log_level_rel]}    # без уровня трат: пересекается с общепитом (|ρ| 0,73)
        nodes_separate: {nodes_mode: separate}        # районы Москвы и Петербурга отдельными узлами
  stability:
    bootstrap: 100          # повторов: 80% узлов без возвращения, у каждого свой seed; ARI на общих узлах
    bootstrap_variants: 20  # в пересчётах sensitivity.variants
    subsample: 0.8          # методы по графу — на подграфе выбранных узлов
    jaccard_stable: 0.75    # по кластерам — Жаккар лучшего совпадения (Hennig, 2007): от 0,75 — устойчив,
    jaccard_dissolved: 0.5  # ниже 0,5 — распадается; в отчёт и в описание типов, не в правило выбора
  interpretability:
    tree_depth: 3
    cv_folds: 5
    inputs: [edges, attributes]   # признаки дерева — корзина (features.space.edges) и X: 17 признаков у всех методов
  # Внешняя проверка типов — НЕ критерий выбора: считается после выбора для итога и для всех кандидатов.
  # Показатели не входят ни в рёбра, ни в атрибуты; доход 5-НДФЛ не годится — сверх зарплаты он ничего
  # не добавляет (docs/network.md, раздел 5).
  validation:
    indicators:             # показатель context_annual -> год
      ip_per_1000: 2024     # ИП на 1000 жителей (на 1 апреля; есть только 2024 год)
      orgs_per_1000: 2024   # организации на 1000 жителей (то же)
      nights_pc: 2023       # ночёвки в коллективных средствах размещения на жителя: есть у 61% узлов,
                            # пропуск — «нет» или «скрыто», нулём не заменяется
    transform: log1p_rel    # ln(1 + x) минус медиана группы региона: как атрибуты, относительно региона
    permutations: 1000      # перестановки меток типов внутри групп региона (состав групп сохраняется)
    alpha: 0.05             # уровень с поправкой Бенджамини — Хохберга по всем проверкам блока
    wage_link_max: 0.5      # |ρ| показателя с log_wage_rel выше — показатель «связан с зарплатой», вывод по нему —
                            # с оговоркой
    # 1) Различие: ε² Краскела — Уоллиса показателя по типам больше, чем при перестановках. Ожидаем для ИП
    #    и организаций; для ночёвок ожиданий нет: траты приезжих в данных не видны.
    # 2) Знаки: ρ Спирмена по узлам между показателем и средним по типу узла значением оси профиля; 1 — в типах
    #    с большим значением оси показатель выше. Знаки — из экономического смысла, записаны до расчёта; при записи
    #    связи этих показателей с осями профиля не смотрели (в разведке ИП участвовали во внешней проверке сюжета
    #    С5 — с приростом доли маркетплейсов, ночёвки — в F14, с чертами трат).
    expected:
      ip_per_1000: {log_level_rel: 1, clr_rel_cafe: 1}      # спрос жителей и траты на услуги держат малый бизнес
      orgs_per_1000: {log_level_rel: 1, urban_share_rel: 1} # организации — в более богатых и городских МО региона
      nights_pc: {}                                          # знак не предсказываем
    # 3) Сверх атрибутов: прирост R² на перекрёстной проверке от меток типа к 11 признакам X (линейная модель,
    #    ранги показателя). Ожиданий нет; результат — в отчёт при любом исходе.
    beyond_attributes: {folds: 5, repeats: 20}
  # ---------------------------------------------------------------------------------------------
  # НЕ ПРЕДРЕГИСТРАЦИЯ. Ключи ниже добавлены этапом 3 (28.09.2026) после коммита предрегистрации 2ee1363:
  # детали реализации, синтетика и параметры отчёта. Вариант и веса метода Шалилеха и Миркина, сетки параметров,
  # K-means и GMM записаны до первого запуска на данных; workers и extra_checks — после отладочного прогона.
  # В правило выбора они не входят; всё, что влияет на числа, записано здесь, а не в коде.
  impl:
    workers: 6              # процессов для тяжёлых шагов (0 — все ядра); итог от числа процессов не зависит
                            # (seed задачи задан её номером); 6 — чтобы уложиться в 16 ГБ памяти
    kmeans_n_init: 20       # K-means (и в гибриде, и в базовой линии): запусков из разных центров на один seed
    gmm: {}                 # GMM — параметры sklearn по умолчанию (полные ковариации, один запуск на seed)
    spectral: {assign_labels: kmeans}   # спектральная: параметры sklearn по умолчанию, affinity — матрица весов G
                            # (von Luxburg // Statistics and Computing. 2007. 17(4). P. 395–416,
                            # doi:10.1007/s11222-007-9033-z). Гибрид (families.attributed) близок к covariate-assisted
                            # spectral clustering: Binkiewicz, Vogelstein, Rohe // Biometrika. 2017. 104(2).
                            # P. 361–377, doi:10.1093/biomet/asx008
    shalileh_mirkin:        # метод Шалилеха и Миркина; вариант выбран по статье до запуска на данных
      variant: kefrin_e     # KEFRiN с квадратом евклидова расстояния: Shalileh S., Mirkin B. Community partitioning
                            # over feature-rich networks using an extended K-means method // Entropy. 2022. Vol. 24,
                            # no. 5. Art. 626, doi:10.3390/e24050626; критерий (5) и правило минимального
                            # расстояния (6)–(7) — разд. 2.2, с. 5–6. K задаётся, как у всех методов сетки;
                            # SEFNAC (Shalileh, Mirkin // Complex Networks & Their Applications IX. Springer, 2021.
                            # SCI 943. P. 3–14, doi:10.1007/978-3-030-65347-7_1; в PLoS ONE, 2021 — ICESi,
                            # doi:10.1371/journal.pone.0254377) извлекает кластеры по одному и сам выбирает K —
                            # для протокола с сеткой K он не подходит
      rho: 1.0              # вес признаков ρ и вес сети ξ: «we take them to be equal, say, to 1» (разд. 2.4, с. 7)
      xi: 1.0
      network: modularity   # стандартизация сети (M): p_ij − p_i+·p_+j / p_++ (разд. 4.1, с. 11: выбрана авторами
                            # для количественных признаков); диагональ P — нули до преобразования
      features: inputs      # признаки — общий X этапа (inputs.scale: robust) вместо z-оценки (Z) статьи: входы
                            # одинаковы для всех методов (предрегистрация); z-оценка — проверка в отчёте
      init: maxmin          # старт: случайный узел, затем узел с наибольшей суммой комбинированных расстояний
                            # до уже выбранных (K-Means++ с MaxMin, разд. 2.2, с. 6); старты — protocol.seeds
      max_iter: 100         # предел итераций (в статье — до совпадения разбиений)
    leiden_grid: {gamma_min: 0.005, gamma_max: 5.0, points: 40, refine: 12}   # Leiden и Louvain: разрешение γ —
                            # логарифмическая сетка, затем деление пополам до нужного K; из γ с одним K — медианный
    hdbscan_grid: {min_size: 5, max_size: 400, points: 40}   # HDBSCAN: min_cluster_size — геометрическая сетка
                            # целых и деление пополам; из значений с одним K — медианное; min_samples — по умолчанию
    edge_perturbation: {drop: 0.1, repeats: 20}   # проверка вне правила выбора: удалить 10% рёбер G, ARI с разбиением
                            # на всей сети (методы, видящие граф)
    ik_means_min_size: 2    # iK-means Миркина (аномальные кластеры по одному) — ориентир K, не критерий: кластеры
                            # меньше порога отбрасываются
    undefined_metric: skip  # записано 28.09 после независимой проверки модуля ICVI (правило было в коде уже при
                            # отладочном прогоне с уменьшенными повторами, до итогового); предрегистрация эту
                            # ситуацию не описывала: метрика, не определённая у кандидата (z = NaN: вырожденный
                            # базис, например AVU ≡ 2/3 при K = 3), в его средний ранг не входит; «NaN → худший
                            # ранг» — проверка чувствительности
    extra_checks:           # проверки вне предрегистрации (на выбор не влияют, в отчёте — отдельно): порог
      min_cluster_share: 0.01   # наименьшего типа 1% вместо 2%; X с хвостами, усечёнными по квантилям 1% и 99%
      clip_quantiles: [0.01, 0.99]  # (у доступности рынков относительно региона хвост до 75 MAD — пригороды)
      # добавлено после предрегистрации (29.09, по замечаниям судьи критерия 3): сетка порогов допустимости —
      # победитель на обоих уровнях при каждой паре «наименьший тип × крупнейший тип»
      grid_min_share: [0.01, 0.015, 0.02, 0.025, 0.03]
      grid_max_share: [0.5, 0.55, 0.6]
    tie_chain_tolerance: 0  # ТОЛКОВАНИЕ предрегистрации «равенство очков — выше stability»: допуск в цепочке не
                            # упомянут, основное правило сравнивает устойчивость без допуска (0); цепочка
                            # с допуском selection.tie.stability — проверка чувствительности tie_chain
    kefrin_curve:           # добавлено после предрегистрации: KEFRiN в варианте статьи (анализ, не выбор) —
      features: [inputs, zscore]   # признаки общего X и z-оценка (Z) авторов
      xi_over_rho: [0.25, 1, 4, 16, 64]   # вес сети ξ при ρ = 1 (как кривая гибрида по α)
    resolution_limit: true  # добавлено после предрегистрации: предел разрешения модульности (Fortunato,
                            # Barthélemy // PNAS. 2007. 104(1). P. 36–41, doi:10.1073/pnas.0605965104) у Leiden
                            # и Louvain — вес внутри сообщества против √(2m/γ)
    seed_check: 5           # добавлено после предрегистрации (ворота этапа 3, 29.09): уровни выбора (без вариантов
                            # входов) при seed, seed + 1, …, seed + 4 для методов и случайного базиса —
                            # частота победителя каждой проверки
    quality_tolerance: baseline_sd   # ОТСТУПЛЕНИЕ от предрегистрации (29.09; там допуск качества 0): допуск ничьей
                            # quality_features и quality_graph = SD критерия по seed_check независимым случайным
                            # базисам (разбиения те же; медиана по допустимым кандидатам), по образцу
                            # network.selection.tie: bootstrap_sd; выбор с ним — рядом с предрегистрированным
  synthetic:                # «когда помогает граф»: известная истина, сила сигнала в графе и в признаках раздельно
    n_nodes: 600
    k_true: 4
    n_features: 11          # как X
    informative: 3          # признаков с сигналом групп, остальные — шум
    n_basket: 6             # координат «корзины», из которых строится граф (как G: kNN по расстоянию, k = 10)
    knn_k: 10
    graph_signal: [0.0, 0.5, 1.0, 1.5, 2.0]     # разнос центров групп в координатах графа (в SD шума)
    feature_signal: [0.0, 0.5, 1.0, 1.5, 2.0]   # разнос центров групп в информативных признаках (в SD шума)
    sbm_mixing: [0.9, 0.7, 0.5, 0.3]  # проверка на посаженном блочном графе networkx: доля рёбер между группами
                            # (при 0,75 = (K − 1)/K граф без сигнала); средняя степень — sbm_degree
    sbm_degree: 14          # как у G (kNN, k = 10: средняя степень ≈ 14)
    repeats: 20             # наборов данных на ячейку сетки (было 5; увеличено по воротам этапа 3)
    min_ari: 0.05           # лучший средний ARI ячейки ниже — победителя нет («нет»);
                            # добавлено 29.09 после первых результатов
    ci_level: 0.95          # интервал среднего ARI по наборам (t-распределение); интервалы двух лучших
                            # перекрываются — «ничья»; добавлено 29.09 после первых результатов
    seeds: 3                # стартов методов со случайностью на набор (итог — по критерию метода)
    methods: [kmeans, ward, gmm, leiden, spectral, shalileh_mirkin, hybrid, kmeans_joint]
  report: docs/clustering.md       # отчёт этапа (собирается кодом, руками не править)
  report_images: docs/img/cluster

icvi:                       # индексы качества (модуль icvi, этап evaluate); в выборе этапа 3 — через z-оценку
  metrics:                  # имя -> пространство и направление
    sw: {space: features, better: max}      # силуэт, Rousseeuw, 1987
    ch: {space: features, better: max}      # Caliński, Harabasz, 1974
    s_dbw: {space: features, better: min}   # Halkidi, Vazirgiannis, 2001
    avi: {space: graph, better: max}        # Biswas, Biswas, 2017
    avu: {space: graph, better: min}        # Biswas, Biswas, 2017
    mq: {space: graph, better: max}         # модульность, Newman, Girvan, 2004
  baseline_permutations: 200   # случайный базис: перестановки меток с теми же размерами кластеров (шум HDBSCAN
                               # в перестановках не участвует); z = (значение − среднее базиса) / SD базиса
  # НЕ ПРЕДРЕГИСТРАЦИЯ: детали реализации модуля icvi (28.09.2026, до расчётов на данных), в правило выбора
  # не входят. Индексы AVI и AVU — Biswas, Biswas, 2017 (текст закрыт); формулы — по пересказу Shalileh и др.,
  # Doklady Mathematics, 2025, с. 555, (18)–(21), сверены с Howie и др., PVLDB, 2023, с. 3175, (36)–(37):
  # внутренние рёбра — упорядоченные пары, AVU = (1/K)·Σ_{k≠l}; в конфиг не вынесены — варианта нет.
  s_dbw_density: pair          # S_Dbw: плотность центров пары — по точкам обоих кластеров, буквально формула (15)
                               # Halkidi, Batistakis, Vazirgiannis (SIGMOD Record, 2002, т. 31, № 3);
                               # own — только свой кластер
                               # (Doklady, 2025, формула (15)); z-оценки для выбора — по pair; читает
                               # icvi.options(cfg), результат передаётся в evaluate и random_baseline
  # Этап evaluate (python -m munnet evaluate), НЕ ПРЕДРЕГИСТРАЦИЯ: параметры отчёта о качестве, в выбор не входят.
  bootstrap: 100               # подвыборок узлов для интервалов: те же выборки, что clustering.stability
                               # (доля — clustering.stability.subsample, без возвращения); метки не пересчитываются
  ci_level: 0.95               # уровень интервала; отклонения подвыборок × √(m/(n − m)) от значения на всех узлах
  report: docs/icvi.md         # отчёт этапа (собирается кодом, руками не править)
  report_images: docs/img/icvi

dynamics:
  window_months: 12
  step_months: 1
  # ПРЕДРЕГИСТРАЦИЯ 28.09.2026 (до расчётов этапа 3): как прослеживаются типы и что считается изменением.
  tracking:
    windows: rolling        # 13 скользящих 12-месячных окон этапа network (network_windows, основной вид)
    place_year: 2023        # признаки места во всех окнах — 2023 год; по окнам меняются корзина (G) и уровень трат
    main: refit_match       # в каждом окне — метод и K, выбранные на 24 месяцах; типы соседних окон сопоставляются
                            # венгерским алгоритмом по Жаккару узлов
    alternatives: [fixed_prototypes, evolutionary]   # фиксированные типы 24 месяцев, узел окна — к ближайшему
                            # (смысл типов неизменен, двигаются узлы); эволюционная кластеризация со сглаживанием
                            # по прошлому окну (Chakrabarti и др., 2006)
    events_jaccard: 0.5     # тип «сохранился», если Жаккар с парой в следующем окне не меньше; иначе — «разделился»,
                            # «слился», «возник» или «исчез» (схема MONIC); чувствительность — 0,3 и 0,7
    change: first_last      # изменение — между непересекающимися окнами 2023 и 2024 годов: соседние скользящие
                            # окна делят 11 месяцев из 12, их сходство задано построением
    noise: odd_even         # шум — разбиения одного года на нечётных и на чётных месяцах (по 6 месяцев: шум
                            # завышен относительно 12-месячных окон, проверка консервативна)
    change_rule: paired_bootstrap   # изменение сверх шума, если нижняя граница 95% интервала бутстрапа узлов для
                            # разности «доля МО, сменивших тип 2023 → 2024» минус «доля смен на шуме» больше нуля
    bootstrap: 1000
    node_transition: stable_halves  # переход МО надёжен, если тип узла совпал на нечётных и чётных месяцах
                            # и в 2023, и в 2024 году, а типы двух лет различаются; прочие смены — «в пределах шума»
    driver: clr_rel_marketplace   # сюжет «сдвиг к маркетплейсам перестраивает типы» — проверка, записанная до
                            # расчёта: у МО с надёжным переходом |изменение clr_rel_marketplace 2023 → 2024| больше,
                            # чем у МО без смены типа (Манн — Уитни, односторонний, α = 0,05); ожидаем, что из шести
                            # частей корзины у маркетплейсов наибольшее отношение медиан |изменения| «переход /
                            # без смены»
  # НЕ ПРЕДРЕГИСТРАЦИЯ (28.09.2026, после записи tracking, до расчёта этапа): параметры реализации.
  impl:
    events_sensitivity: [0.3, 0.7]  # пороги Жаккара для чувствительности событий (названы в комментарии
                            # к events_jaccard)
    level: 0.95             # интервал бутстрапа (95% в change_rule), перцентильный
    driver_alpha: 0.05      # уровень проверки driver (записан в комментарии к driver)
    final_ari_min: 0.99     # перефит метода на 24 месяцах должен повторить cluster_final (ARI), иначе стоп
    noise_mean: years       # толкование noise: доля «смен» на шуме — среднее двух лет (2023 и 2024), каждая — между
                            # разбиениями нечётных и чётных месяцев; комментарий предрегистрации этого не уточняет
    evolutionary:           # эволюционный K-means: Chakrabarti D., Kumar R., Tomkins A. Evolutionary clustering //
                            # KDD 2006, с. 554–560, разд. 4.2: c_j ← (1 − γ)·cp·c_f(j) + γ·(1 − cp)·среднее кластера,
                            # γ = n_j / (n_j + n_f(j)), c_f(j) — ближайший центр прошлого окна; вместо нормировки центра
                            # к единичной длине (объекты авторов на сфере) — веса к сумме 1; при γ = 1/2 — правило
                            # патента тех же авторов US 8930365 B2
      epsilon: 0.5          # параметр изменения cp статьи; рекомендованного значения у авторов нет — равный вес
      epsilon_grid: [0.0, 0.2, 0.5, 0.8]   # чувствительность к весу истории (0 — обычный K-means со стартом
                            # от центров прошлого окна)
      max_iter: 300
    map_flow_min: 10        # на карте свой цвет — у надёжного перехода «тип → тип» не меньше чем с 10 узлами
    top_regions: 10         # регионов в таблице «где переходы»
    examples: 5             # примеров МО на переход в отчёте
  report: docs/dynamics.md
  report_images: docs/img/dynamics

# ПРЕДРЕГИСТРАЦИЯ 29.09.2026, редакция 3 — после четырёх кругов разбора (devils-advocate и judge-c5) и отрицательных
# контролей без меток типов, до расчётов по типам. Этап 5 — интерпретация: `python -m munnet interpret`, выходы — outputs/interpret/,
# отчёт — docs/interpretation.md; код этапа пишется после отдельного коммита этого блока. Здесь до любых расчётов
# этапа 5 по типам записаны проверки тезиса 29.09 (PLAN.md, этап 1): решающие T1, T2, T3, T5, T6, T7 и описание T4;
# отрицательные контроли; фильтр устойчивости R1; правила профиля, названий, примеров МО, описания типов правилами,
# сборки главного вывода и расчётов вне проверок. Правило участника 29.09: если проверка не подтвердилась, меняется
# текст (outcomes), а не проверка. Менять блок после расчётов — только с записью в docs/interpretation.md: что
# изменено, когда, почему и что дало бы исходное правило. Что по типам было известно до записи — ключ seen_before:
# эти числа подтверждениями не служат, и порогов под них нет. Проверки, исход которых следует из признаков
# кластеризации (X, G) или известен заранее, помечены circularity и дают описание, а не вывод (Gao, Bien, Witten,
# 2022: p-значения по признакам кластеризации некорректны).
# Польза — проверяемое утверждение T7. Пользователь — региональное министерство экономического развития; решение —
# подобрать для своего МО «сопоставимые территории» из других регионов (ближайшие по корзине МО; ограничение «того же
# типа» — только если T7 покажет, что тип что-то добавляет) и сверять с ними динамику. Утверждение: изменение
# розничного оборота 2023 → 2024 у такого набора ближе к изменению у самого МО, чем у соседей по своему региону
# и у случайных МО того же размера. Аналитики СберИндекса (смена типа как ранний сигнал) — утверждение держится на T2
# и T3 и без них не делается; бизнес (площадка, сезонный персонал, запасы) — отдельной проверки нет, поэтому для него
# только профили типов, без обещаний прогноза.
interpret:
  seed: 42                  # равен общему seed; код сверяет с cfg["seed"], расхождение — ошибка (код 3)
  windows:                  # окна — как у dynamics.tracking (change: first_last, place_year)
    year_a: ["2023-01", "2023-12"]   # окно «до»: type_2023, корзина 2023 года
    year_b: ["2024-01", "2024-12"]   # окно «после»: type_2024
    place_year: 2023        # год признаков места и внешних показателей уровня во всех проверках
    change_years: [2023, 2024]       # изменения внешних показателей (T6, T7) — между этими годами
  freshness: strict         # выходы evaluate и dynamics старше data/processed/cluster_labels.parquet — стоп (код 1).
                            # На 29.09 так и есть (28.09 21:34 и 21:54 против 29.09 00:18): до расчётов этапа 5
                            # перезапускаются evaluate и dynamics
  scope:
    city_nodes: [90077, 90078]   # Москва и Петербург — узлы-города: показателей Росстата в context_annual у них
                            # нет (только city_context); в проверках не участвуют, в таблицах — отдельной строкой
    phrase: "о {n_nodes} узлах сети в {n_regions} регионах — МО с полным рядом за 24 месяца; ещё {n_partial} МО с неполным рядом не типизированы (медиана населения у них ниже)"
                            # числа выводит код, не «о России»; n_partial — МО территорий с series_status ≠ full
  ladder:                   # гипотеза тезиса 29.09: ступени от сельской корзины трат к городской
    order: [2, 1, 3, 4]     # номера типов cluster_final снизу вверх; ранг ступени — 1…4
    sizes: {1: 806, 2: 473, 3: 394, 4: 103}   # размеры при записи. После перезапуска cluster одно правило: тот же
                            # набор размеров, номера другие — номера переносятся по размеру (все четыре размера
                            # разные, перенос однозначен), перенос записывается в отчёт; другой набор размеров —
                            # стоп (код 3) и новая запись предрегистрации
  seen_before:              # известно до записи блока: не подтверждение, порогов под эти числа нет
    - "медианы признаков по типам, табл. 10 docs/clustering.md: urban_share_rel 0,00 / −0,10 / 0,18 / 0,40, log_pop_rel 0,00 / −0,51 / 0,77 / 2,21, market_access_rel, занятость, корзина (типы 1 / 2 / 3 / 4)"
    - "размеры типов 806 / 473 / 394 / 103 и Жаккар по Хеннигу 0,90–0,94 (docs/clustering.md, табл. 9)"
    - "порядок 2 < 1 < 3 < 4 по общепиту в корзине и формулировки тезиса («село», «районные центры», «города и пригороды», «крупные города») — PLAN.md, этап 1"
    - "дерево глубины 3: каппа 0,89, первое разбиение — общепит в корзине (docs/clustering.md, разд. 7; outputs/cluster/tree_rules.txt)"
    - "AMI типов с группой региона −0,003 (docs/clustering.md, разд. 7)"
    - "итог почти повторяет спектральную кластеризацию одного графа: ARI 0,94, с K-means по X — 0,16, «признаки места в типах почти не участвуют» (docs/clustering.md в коммите 51c8604, строки 16, 133, 359; PLAN.md:150, 167; outputs/cluster/alpha_curve.csv, ari_final при α = 1 и α = 0)"
    - "внешняя проверка этапа 3: ИП, организации, ночёвки — ε², знаки, ΔR² сверх атрибутов 0,006 / 0,026 / 0,010 (docs/clustering.md, разд. 8)"
    - "динамика: тип сменили 15,3% узлов против 5,5% на шуме; 181 надёжный переход (10,2%) в 55 регионах из 73 (docs/dynamics.md:12, 155)"
    - "потоки надёжных переходов (docs/dynamics.md:143–150): 2 → 1 — 74, 1 → 3 — 55, 1 → 2 — 26, 3 → 4 — 18, 3 → 1 — 5, 2 → 3 — 1, 4 → 2 — 1, 4 → 3 — 1; по ladder.order «вверх» 148, «вниз» 33"
    - "при фиксированных типах надёжных переходов 161; в названных потоках 2 → 1 — 61, 1 → 2 — 38, 1 → 3 — 35, 3 → 4 — 11, то есть «вверх» не меньше 107 (docs/dynamics.md:211; мелкие потоки там не названы)"
    - "D2 первой редакции по опубликованным потокам (расчёт judge-c5, второй круг): при диагонали вне знаменателя нулевая доля «вверх» 0,785 и D2 ≈ +0,033 (SE ≈ 0,029); при диагонали как «не вверх» — 0,551 и D2 ≈ +0,267. Исход решался прочтением правила, поэтому D2 — описание"
    - "проверка driver: у маркетплейсов отношение медиан |изменения| 1,25, p = 0,001 (первая часть выполнена), но это 5-е место из шести частей; первое — общепит, 2,11 (docs/dynamics.md:14, 183–197)"
    - "примеры МО по потокам переходов в docs/dynamics.md (правило dynamics.impl.examples)"
    - "ARI итога 0,22 с сетью косинуса и 0,32 с районами Москвы и Петербурга отдельными узлами (PLAN.md:133)"
    - "расчёты без меток типов (devils-advocate, второй круг, scratchpad da2/trivial.py): ρ Спирмена по 1774 узлам — плотность с log_pop_rel 0,72; розница Росстата с log_pop_rel 0,60 и с urban_share_rel 0,60; городской округ 0,35 и 0,46; столица 0,30; общепит Росстата 0,29. Разбиение «4 группы по квантилям log_pop_rel с размерами типов» проходит T1 первой редакции (5 из 5 «за») и T5 первой редакции (наибольший AMI 0,27; ε² внутри абсолютных страт 0,018 и 0,033, p = 0,003). Отсюда условные версии T1 и T5, сравнение с делениями «только место» и отрицательные контроли"
    - "expert-economist при записи видел только покрытие данных без разбивки по типам, число уникальных type_jaccard на тип и коды регионов справочника; внешние показатели T1, T5, T6, T7 по типам не считал никто"
