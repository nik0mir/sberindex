  bdmo_dir: bdmo                    # data/raw/bdmo/<файл>.csv.gz, разделитель «;», все колонки читаются строкой
  level: Муниципальное образование верхнего уровня
  na_codes: [CD, ND, UD]
  read_years: [2022, 2023, 2024, 2025]
  okved_total: &total Всего по обследуемым видам экономической деятельности
  okved_letters: {А: A, В: B, Е: E, Н: H}   # кириллица в метках БД ПМО -> латиница
  okved_groups:
    primary: [A, B]                 # сельское хозяйство, добыча
    industry: [C, D, E]             # обработка, энергетика, водоснабжение
    trade_transport: [F, G, H]      # стройка, торговля, транспорт
    market_services: [I, J, K, L, M, N, R, S, T]
    public: [O, P, Q]               # госуправление, образование, здравоохранение
  unallocated_tolerance: 0.01       # раскрытые доли занятости в сумме больше 1 + 1% — предупреждение в логе
  indicators:                     # kind: stock — запас (на дату), flow — поток за год, mean — среднее за год
    population:      {file: Y48112027, dims: {mest: Все население}, kind: stock,
                      periods: [На 1 января, Значение показателя за год], years: [2022, 2023, 2024, 2025]}
    population_urban: {file: Y48112027, dims: {mest: Городское население}, kind: stock,
                       periods: [На 1 января, Значение показателя за год], years: [2023, 2024]}
    population_rural: {file: Y48112027, dims: {mest: Сельское население}, kind: stock,
                       periods: [На 1 января, Значение показателя за год], years: [2023, 2024]}
    employees:       {file: Y48423005, by: okved2, kind: flow, periods: [Январь-декабрь], years: [2023, 2024]}
    payroll:         {file: Y48423006, dims: {okved2: *total}, kind: flow, periods: [Январь-декабрь], years: [2023, 2024]}
    wage:            {file: Y48423007, dims: {okved2: *total}, kind: mean, periods: [Январь-декабрь], years: [2023, 2024]}
    retail:          {file: Y48401003, dims: {okved2: *total}, kind: flow,
                      periods: [Январь-декабрь, Значение показателя за год], years: [2023, 2024]}
    catering_turnover: {file: Y48401006, dims: {okved2: *total}, kind: flow,
                        periods: [Январь-декабрь, Значение показателя за год], years: [2023, 2024]}
    shipments:       {file: Y48401011, by: okved2, keep: [TOTAL, B], kind: flow,
                      periods: [Январь-декабрь, Значение показателя за год], years: [2023, 2024]}
    orgs:            {file: Y49010002, kind: stock, periods: [На 1 апреля, На 1 июля, На 1 октября], years: [2024]}
    ip:              {file: Y49010003, kind: stock, periods: [На 1 апреля, На 1 июля, На 1 октября], years: [2024]}
    nights:          {file: Y47000004, dims: {vozr: Всего}, kind: flow, periods: [Значение показателя за год],
                      years: [2023, 2024]}
    beds:            {file: Y48060002, kind: stock, periods: [Значение показателя за год], years: [2023, 2024]}
    invest:          {file: Y48109001, dims: {istinv: Всего, okved2: *total}, kind: flow,
                      periods: [Значение показателя за год, Январь-декабрь], years: [2023]}
  age:
    files: {2023: Y48112014_2023, 2024: Y48112014_2024}
    dims: {grup_2: Всего}
    period: На 1 января
    groups: {young: Моложе трудоспособного возраста, working: Трудоспособный возраст,
             old: Старше трудоспособного возраста}
    sum_tolerance: 0.01             # сумма трёх групп расходится с «Всего» больше чем на 1% — флаг age_sum_mismatch
  ndfl:
    file: ndfl/data_5ndfl_155_v20260722.parquet   # 34 млн строк: только pyarrow.dataset с фильтром
    years: [2022, 2023, 2024]
    object_level: Муниципальное образование верхнего уровня
    tax_authority: Всего
    income: {indicator_code: Y777000006, tax_rate: Всего}    # не Y777000030: на уровне МО почти везде 0
    recipients: {indicator_code: Y777000028, individual_type: Всего, income: Всего}
    recipients_ratio_ok: [0.05, 3.0]   # получатели / жители вне интервала -> ndfl_ok = false
    city_rows: {object_level: Субъект РФ, report_type: Свод}   # строки городов nodes.cities (узлы-города);
                                       # report_type «МО» у Москвы — другой отчёт (135 получателей вместо 18 млн)

# ---------------------------------------------------------------------------------------------
# Этап 1. Разведочный анализ (python -m munnet eda): графики, таблицы, outputs/eda/facts.json, docs/eda.md.
eda:
  reference_year: 2024
  north_lat: 60.0
  summer_months: [6, 7, 8]
  robust_z: 3.5
  top_n: 10
  knn_main: 8
  knn_sensitivity: [5, 12]
  permutations: 999
  bootstrap: 1000
  pair_sample: 20000               # пар МО для распределения корреляций рядов (T06)
  season:                          # раздел E3 «Годовой ритм» (s3_rhythm.py)
    reliable_r: 0.6                # повторяемость своего профиля 2023 ~ 2024
    reliable_amplitude: 0.05       # размах своего профиля, лог-пункты
    null_repeats: 20               # перестановок месяцев 2024 года для нулевого распределения
    top_n: 15                      # T05: надёжных МО с наибольшим размахом своего профиля
    examples: 4                    # регионов и МО-примеров в строковых фактах для текста
    profile_categories: [all, food, marketplace, transport, health, cafe]   # F06: панели общего ритма
    noise_categories: [all, cafe, transport]   # T07: шум своего ритма по группам населения
    noise_groups: 10               # T07: группы МО по населению (децили)
    hint_z: 2.0                    # подсказка к МО в T05: признаки контекста с |робастный z| > 2 (Б.1, п. 8)
    hist_bin: 0.05                 # F07: ширина столбца гистограммы r
    map_step: 0.05                 # F08: шаг классов летнего избытка своего профиля (0,05 ≈ 5%)
    map_classes_side: 4            # F08: не больше 4 классов по каждую сторону нуля
  step_test_pp: 2.0                # скачок годового прироста доли маркетплейсов между соседними месяцами, п. п.
  economy_types:                   # гипотезы о типах местной экономики (T11): DataFrame.query над EdaData.mo
    inner_city: {rule: is_inner_city}
    capital: {rule: is_capital}
    suburb: {rule: "dist_capital_km <= 50 and not is_capital and not is_inner_city"}
    north: {rule: "point_lat >= 60"}
    mining: {rule: "emp_sh_B_2023 >= 0.2"}
    manufacturing: {rule: "emp_sh_C_2023 >= 0.3"}
    agrarian: {rule: "emp_sh_A_2023 >= 0.2"}
    public_periphery: {rule: "emp_sh_public_2023 >= 0.55"}
    resort: {rule: "nights_pc_2023 >= 5"}
  rejection:                       # критерии отказа сюжетов (часть Б.5): сюжет «главный», только если выполнены
    s1_reliable_share_min: 0.25
    s2_partial_rho_min: 0.2
    s3_half_consistency_min: 0.5
    s4_residual_share_min: 0.3
    s4_residual_stability_min: 0.7
    s5_split_half_min: 0.5
    s5_rho_within_min: 0.3
    s6_usable_min: 1500
    s6_suburb_ratio_min: 1.2
    s1_null_ratio_min: 3.0         # С1: доля надёжных МО не меньше чем втрое больше доли на перестановочном нуле
    s6_suburb_p_max: 0.01          # С6: отличие пригородов надёжно при p Манна — Уитни меньше
  matrix_weights:                # из весов критериев жюри (часть Б.5); сумма 1
    signal: 0.25
    network_dynamics: 0.20
    practical: 0.20
    coverage: 0.15
    explainability: 0.10
    data_risk: 0.10
  # Помесячный ИПЦ Росстата {source: ссылка, base: "2022-12", kind: level | mom, values: {"2023-01": …}};
  # kind необязателен: level — уровень к base (по умолчанию), mom — % к предыдущему месяцу. null — только номинал.
  cpi: null
  # territory_id: «пояснение» — подсказка к МО в таблицах выбросов (T03, T05, T12). Причина не проверена —
  # в тексте «гипотеза».
  annotations:
    2535: центр Москвы, дорогое жильё и обеспеченные жители (гипотеза)
    2544: центр Москвы, дорогое жильё и обеспеченные жители (гипотеза)
    2344: столица Чукотки, северные надбавки и дорогой завоз (гипотеза)
    2349: золотодобыча и атомная станция, северные надбавки (гипотеза)
    502: сельский округ Чувашии, низкие зарплаты, много пожилых, возможно, больше наличных (гипотеза)
    925: Астраханский газоперерабатывающий завод, работники живут в других МО (гипотеза)
    883: стройка Амурского газоперерабатывающего завода, вахтовые работники (гипотеза)
    370: Иннополис, высокие зарплаты у работодателей, часть работников живёт в Казани (гипотеза)
    1783: пригород Пскова (гипотеза)
    2063: пригород Смоленска (гипотеза)
  report: docs/eda.md
  report_images: docs/img/eda
  figure: {dpi: 200, formats: [png, svg], docs_max_kb: 400}
  # Дополнения пакета F к части Г: параметры, которые иначе были бы числами в коде.
  level_rel_min_months: 6          # level_rel_<год>: уровень к медиане страны, если в году не меньше 6 месяцев (Б.2)
  figure_limits: {title_max: 90, subtitle_max: 120, alt_min: 40}   # знаков: заголовок, подзаголовок, альт-текст (В.2)
  maps:                            # картограммы (maps.py)
    insets:                        # врезки: 247 внутригородских территорий на общей карте не видны
      moscow: {region_code: 77, title: Москва, extent_km: 45}            # окно вокруг медианы точек МО, км
      spb: {region_code: 78, title: Санкт-Петербург, extent_km: 60}
  # Параметры разделов разведки и отчёта. Значения совпадают с умолчаниями в коде модулей (*_DEFAULTS,
  # DEFAULTS); источник истины — этот файл. Неизвестный ключ в секциях basket, place, stories, synthesis
  # и report_render — ошибка (ValueError или KeyError): опечатка не должна молча оставлять умолчание.
  coverage:                        # раздел E1 «Что есть в данных» (s1_coverage.py)
    full_share_min: 0.9            # проверка заголовка F02: полный ряд не меньше чем у 90% МО панели
    month_thresholds: [12, 18, 24] # пороги длины ряда для узла сети (Б.6): сколько МО и жителей остаётся
    text_regions: 3                # сколько регионов называть в тексте раздела
    missing_alpha: 0.01            # уровень теста Манна — Уитни, ниже которого пропуски называются неслучайными
    gap_indicator: wage            # показатель Росстата для поиска регионов без годовых значений в опорном году
  level:                           # раздел E2 «Сколько тратят» (s2_level.py): карта, гистограмма, подписи F05
    map_classes: 7                 # квантильных классов на карте уровня (F04)
    hist_bins: 40                  # столбцов гистограммы уровня (F03), равных в логарифме
    labels_per_side: 3             # подписей МО выше и ниже линии на F05 (В.2: всего не больше 5–7)
    hint_z: 2.0                    # |робастный z| признака контекста для подсказки T03 (Б.1, п. 8)
    hint_max: 3                    # признаков в подсказке одного МО
    md_per_side: 7                 # строк сверху и снизу в Markdown T03 (в отчёте ≤ 15 строк)
    names_in_fact: 3               # МО в фактах top_names и bottom_names
    rub_ticks: [10000, 15000, 20000, 30000, 50000, 70000, 100000, 150000]   # деления осей трат, ₽
    wage_ticks: [20000, 30000, 50000, 100000, 200000, 300000, 500000]       # деления оси зарплаты, ₽
    axis_pad: 1.06                 # запас лог-оси за краями данных, множитель
    label_columns:                 # колонки подписей F05 с выносными линиями, доли осей
      above: {x: 0.02, y: 0.98}    # «выше линии» — сверху слева, стопкой вниз
      below: {x: 0.98, y: 0.03}    # «ниже линии» — снизу справа, стопкой вверх
    label_gap_pt: 6                # просвет между подписями в колонке, pt
    column_margin: 0.03            # зазор между колонкой подписей F05 и ближайшей подписанной точкой, доля ширины
    checks:                        # проверки заголовков (В.5)
      wmean_ratio_min: 1.2         # F03: среднее по жителям ≥ 1,2 × медиана МО
      eta2_min: 0.6                # F04: η² региона для лог-уровня
      rho_wage_min: 0.7            # F05: ρ уровня с зарплатой
  basket:                          # раздел E4 «Корзина и маркетплейсы» (s4_basket.py)
    n_components: 3                # главных компонент CLR в T08
    level_groups: 5                # группы МО по уровню трат 2023 года на F12 (допустимо 4, 5, 10)
    label_n: 6                     # подписей МО на F10 и F13 (В.2: не больше 5–7)
    label_box: [0.35, 0.12]        # размер подписи в долях размаха осей: подписанные точки не ближе
    trend_bins: 10                 # линия тренда F10 и F13 — медиана по группам уровня (допустимо 4, 5, 10)
    display_quantiles: [0.0, 1.0]  # ось роста на F13; [0.005, 0.995] — хвосты у края оси
    weak_rho: 0.1                  # |ρ| меньше — в тексте «связи почти нет»
    slow_spread: 0.1               # SD лог-уровня выросло меньше чем на 10% — «разрыв растёт медленно»
    headline:                      # проверки заголовков F10–F13 (В.5)
      pc1_rho_min: 0.6             # F10: ρ PC1 с лог-уровнем не меньше
      mp_annual_ratio_min: 1.2     # F11: медиана годовых долей 2024 / 2023 не меньше
      quintile_gap_pp_min: 1.0     # F12: прирост нижней группы минус верхней, п. п., не меньше
      growth_rho_min: 0.2          # F13: ρ роста с уровнем в целом и внутри регионов не меньше
  place:                           # раздел E5 «Экономика места» (s5_place.py)
    faint_abs_rho: 0.1             # F14: |ρ| меньше — клетка светлая, связи нет
    fact_abs_rho: 0.3              # клетки F14 с |ρ| не меньше — в факты rho_within_*
    headline_abs_rho: 0.2          # связь, названная в заголовке и тексте, не слабее
    headline_skip: [wage]          # черты места вне заголовка F14 (зарплата — тема E2)
    exclude_workplace_based: true  # F14 без МО, где занятость и доход считаются по месту работы
    types_exclude_workplace_based: true   # T11: то же для типов, правило которых не про такие МО явно
    hint_z: 2.0                    # подсказка: черты контекста с робастным |z| больше
    hint_max: 3                    # не больше стольких черт в подсказке
    edge_n: 7                      # T12: МО с каждого края отношения «траты / доход 5-НДФЛ»
    label_high: 4                  # F15: подписей МО с высоким отношением
    label_low: 3                   # F15: подписей МО с низким отношением
    examples_n: 3                  # T11: примеров на тип
    examples_by: weight            # T11: примеры — МО типа с наибольшим значением этой колонки mo
    mw_alpha: 0.01                 # F15: отличие пригородов надёжно при p Манна — Уитни меньше
    suburb_type: suburb            # тип из economy_types, по которому считаются факты suburb_*
    suburb_sens_km: [25, 50, 100]  # чувствительность: пороги расстояния пригорода, км
    suburb_district_types: [mr, mo]   # вариант «только районы и округа», без городов-спутников
    check_sections: [A, O, G]      # разделы ОКВЭД2 для сверки с ориентиром Б.4 «без учёта регионов»
    check_level: level_rel_2023    # уровень трат сверки: к медиане страны, есть и у неполных рядов
  stories:                         # сюжеты и матрица решения (stories.py); пороги отказа — в rejection
    signal_bins:                   # балл силы сигнала: меньше bins[0] → 1 … не меньше bins[3] → 5
      s1: [0.1, 0.2, 0.3, 0.4]     # доля МО с устойчивым своим ритмом
      s2: [0.1, 0.2, 0.3, 0.4]     # |частный ρ| уровня с доступностью рынков
      s3: [0.3, 0.45, 0.6, 0.75]   # ρ роста по полугодиям
      s4_residual: [0.1, 0.2, 0.3, 0.4]   # доля дисперсии CLR после очистки от уровня и региона (не Б.5:
                                          # устойчивость очищенной PC1 одинакова у любой очищенной доли)
      s5: [0.3, 0.45, 0.6, 0.75]   # ρ прироста доли маркетплейсов по полугодиям
      s6: [1.1, 1.25, 1.5, 2.0]    # траты к доходу 5-НДФЛ: пригороды к остальным
    coverage_bands: [0.6, 0.7, 0.8, 0.9]   # балл покрытия по доле МО панели, пригодных для сюжета
  synthesis:                       # сводка «Регион или место» (synthesis.py); показатели МО — в коде
    eta2_regional: 0.6             # Б.6 (4): η² выше — показатель почти целиком региональный
    place_eta2_max: 0.5            # «больше свойство места»: η² ниже
    headline:                      # проверка заголовка F16 (В.5); {y} — reference_year, {p} — год раньше
      level: "log_level_{y}"       # показатель «свойство региона»
      dynamic: {growth_log: рост, mp_pp_change: сдвиг к онлайну}   # «больше свойство места» -> слово заголовка
      gap_min: 0.3                 # η² уровня минус наибольший η² динамики — не меньше
    definition_checks:             # сверка определений: показатель -> [колонка mo, почему сравниваем]
      "log_level_{y}": ["log_level_{p}", "тот же показатель за {p} год"]
      "clr_cafe_{y}": ["sh_cafe_{y}", "сырая доля общепита вместо CLR (Б.1, п. 3: в связях — только CLR)"]
      "clr_marketplace_{y}": ["clr_marketplace_{p}", "тот же показатель за {p} год"]
  report_render:                   # сборка docs/eda.md (report.py)
    strict_lint: true              # замечания lint_ru останавливают сборку, отчёт не пишется
    shrink_oversize: true          # PNG больше figure.docs_max_kb — пересохранить с палитрой
    png_colors: 256                # цветов палитры при сжатии
    lint_allow:                    # что lint_ru не считает ошибкой (регулярные выражения)
      - 'CC BY(?:-SA)? \d\.\d'     # номер лицензии
      - '\b\d{1,2}\.\d{2}\.\d{4}\b'   # дата через точку
    number_allow:                  # числа текста, которые не обязаны быть фактами (регулярные выражения)
      - '\b20\d\d\b'               # годы
      - '\b\d+-(?:й|го|м|му|х|е|я)\b'   # порядковые: «90-й перцентиль», «2024-м»
      - '\b1–5\b'                  # шкала баллов
      - '1,4826'                   # константа MAD
      - '\b0,5(?=\W+не лучше угадывания)'   # AUC 0,5 — угадывание
