  decisions:                # решения участника 30.09.2026 по docs/landing_spec.md, §11
    palette: ordered_only_confirmed
    headlines: preregistered_and_checked
    default_map: equal_cells_both_sizes   # карта по умолчанию — равные ячейки на 1440 и 375 px
