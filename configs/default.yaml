    js: vanilla_plus_threejs   # 30.09, после вскрытия (решение участника): объёмная карта — three.js 0.170.0 (MIT)
                            # из vendor/; было vanilla (d3-модули под ISC — только если без них сильно дольше)
    business_role: keep_with_label
    pages: submission_day   # GitHub Pages — в день подачи, после открытия репозитория
  freeze:                   # заморозка словарей до вскрытия этапа 5: этап site считает sha256 канонического JSON
                            # (json.dumps(..., ensure_ascii=False, sort_keys=True, separators=(",", ":"))) ключей covers
                            # и сверяет с sha256; расхождение — код 3. Правка после вскрытия — только новым хешем
                            # в отдельном коммите с записью в docs/landing_spec.md, §4.3 («Журнал правок»)
    covers: [verdicts, headlines, forbidden_words, roles, palette_rule, similarity_layout, always, n_similar_shown,
             similar_caption, decisions]
    sha256: d3845f9f178bab27802b9466af147f2a2d4097b343bda4d723aece688e5a69df   # последний шаг перед коммитом блока; пересчёт — после любой правки covers
  build:                    # НЕ ПРЕДРЕГИСТРАЦИЯ: технические параметры сборки (docs/landing_spec.md, §5); от вердиктов
