  profile:                  # профиль типа — описание, не проверка: p-значений по признакам кластеризации нет
    features: [edges, attributes]   # 17 признаков входов (features.space.edges ⊕ features.space.attributes)
    center: median          # медиана и межквартильный размах типа против всех узлов
    effect_unit: mad        # отклонение медианы типа от общей медианы в единицах MAD × 1,4826
    cliff_delta: true       # дельта Клиффа «тип против остальных» с 95% бутстрап-интервалом
    bootstrap: 1000         # интервалы медиан и дельты Клиффа, бутстрап узлов
    ci_level: 0.95
    weights: [none, pop_avg]   # «типичное МО» (без весов) и «типичный житель» (веса населения 2023 года) — рядом
    # Порог «характерного признака» по относительному отклонению среднего (~30%, работы Миркина) к признакам
    # относительно региона неприменим: их общее среднее близко к нулю по построению. Своё правило — naming.
  place_partitions:         # деления без типов — «соперники» типов в T1 (b) и T5 (3) и деления T5 (1). РЕДАКЦИЯ 3:
                            # в редакции 2 соперников было три (log_pop_rel, urban_share_rel, market_access_rel), и деление
                            # по одной log_wage_rel проходило T1 и T5 (seen_before, круг 3). «Сверх места» теперь значит
                            # сверх любого одного признака X и сверх K-means по признакам места
    nodes: territorial      # строятся один раз на всех территориальных узлах (без scope.city_nodes; 1774 при записи),
                            # затем урезаются по пропускам показателя и страты
    values: clustering_x    # X, как его видела кластеризация: признаки места года clustering.inputs.place_year,
                            # log_level_rel за 24 месяца, пропуск — медиана группы региона (clustering.inputs.impute),
                            # до масштаба (munnet.clustering.inputs.impute_region_median)
    sized:                  # 4 группы по возрастанию значения; размеры — как у типов среди территориальных узлов
                            # по ladder.order снизу вверх; при равных значениях ниже — меньший territory_id
      features: attributes  # все 11 признаков features.space.attributes, каждый в обе стороны (x и −x): группы разного
                            # размера, поэтому это разные деления — 22 деления
      composite: [rank_pop_urban]   # сумма рангов log_pop_rel и urban_share_rel, тоже в обе стороны — 2 деления
    place_only: interpret.tests.T4_basket_vs_place.place   # K-means по 10 признакам места, seed, n_init — как T4
    orientation:            # порядок групп соперника в T1 (b) — самый выгодный сопернику, выбирается для каждого
      sized: sign_of_rho    # оборота на полной выборке: у делений sized — по знаку ρ (b) (при минусе порядок обращается),
      place_only: best_of_24   # у place_only — лучший из 24 порядков групп по ρ (b); в бутстрапе порядок не меняется.
                            # В T5 (3) порядок не нужен: ε² от него не зависит
    rival_max: per_bootstrap   # «наибольший у соперников» — максимум по 25 соперникам на каждой бутстрап-выборке
    best_partition: point   # «{best_partition}» в текстах — соперник с наибольшим ρ (b) (в T5 — ε²) на полной выборке
                            # для этого оборота, с подписью признака, как в отчёте этапа 3; рядом — его ρ или ε²
  strata:                   # страты условных версий T1 (b) и T5 (3): относительные признаки, как в X
    features: {log_pop_rel: 5, urban_share_rel: 5}   # квинтили × квинтили = 25 страт, год place_year
    values: raw             # значения без замены пропусков: узлы без log_pop_rel или urban_share_rel (47 без
                            # urban_share_rel при записи) в T1 (b) и T5 (3) не участвуют, их число публикуется
    nodes: territorial_both # квинтили — один раз по рангу на территориальных узлах с обоими признаками (1727 при
                            # записи), ничья — меньший territory_id ниже; потом урезаются по пропуску показателя
    within_rank: average_over_n   # ранг показателя внутри страты — rank(method=average) / n_s
  controls:                 # отрицательные контроли: правила T1 и T5 на делениях без типов, которые несут только
                            # информацию X, но НЕ входят в набор соперников place_partitions. РЕДАКЦИЯ 3: в редакции 2
                            # контроль (деление по log_pop_rel) сам входил в набор и проходил по построению (круг 3)
    partitions:             # все — на узлах place_partitions.nodes, со значениями place_partitions.values
      place_only_seed: {base: place_only, seed_offset: 1}        # K-means place_only с seed + 1
      place_only_zscore: {base: place_only, scale: zscore}       # z-оценка вместо robust
      density_rel: {source: pop_avg/area_km2, year: 2023, transform: log_rel, missing: zero}   # заместитель размера
                            # вне X (ln плотности минус медиана группы региона); пропуск — 0, то есть медиана региона
      place_pc1: {features: interpret.tests.T2_direction.place_tree.features, scale: robust, method: pca1}
      composites:           # сумма robust-оценок признаков X (clustering.inputs.scale), группы размеров типов
        - [log_wage_rel, log_pop_rel]
        - [log_wage_rel, log_level_rel]
        - [log_wage_rel, urban_share_rel]
        - [log_wage_rel, log_pop_rel, urban_share_rel]
        - [log_level_rel, log_pop_rel]
    sizes: ladder           # 4 группы размеров типов, кроме K-means (свои размеры)
    order: best_of_24       # ранг ступени контроля — лучший из 24 порядков групп по ρ (b) общепита на полной выборке,
                            # один на оба оборота: самый выгодный контролю, то есть самый строгий к правилу
    random: {draws: 20, sizes: ladder}   # случайные метки тех же размеров, от seed; порядок — как выпал
    expected:               # вердикт контроля не выше ожидаемого (порядок вердиктов — rule.levels теста)
      T1_ladder_external: {partitions: partial_overall, random: not}
      T5_trivial: {partitions: not_empty, random: not_empty}   # то есть not_repeats или not_empty
    random_max_above: 2     # случайных розыгрышей выше ожидаемого — не больше 2 из 20 (при 5% ошибок на розыгрыш
                            # больше двух выпадает с вероятностью ≈ 0,08)
    on_fail: stop           # иначе стоп (код 3): правило не отличает тип от экономики места, нужна новая запись
    reference:              # описание без ожидания, в вердикт и в on_fail не входит
      self_out: true        # T1 на каждом делении place_partitions.sized (по x) с исключением обеих его ориентаций
                            # из соперников, порядок — controls.order: какой один признак X упорядочивает обороты
                            # сверх остальных
      basket_parts: true    # T1 и T5 (3) на делениях по одной части корзины (clr_rel_* за 24 месяца, размеры типов):
                            # чем типы отличаются от одной части корзины. Это не отрицательный контроль: корзина — сигнал
                            # типов, и её часть вправе упорядочивать обороты
    publish: true           # вердикты контролей и справки — в отчёт при любом исходе
    seen: "Правила редакции 3 на контролях до коммита, без меток типов (expert-economist, scratchpad ee3/newrule.py → out_1000.json; 1000 перестановок и бутстрап-выборок; X как во входах clustering; 1774 территориальных узла, размеры пропорционально 472 / 805 / 394 / 103; со стратой 1727; общепит 1241 и 1208 со стратой, розница 1705 и 1666; coverage_class 690 / 339 / 745). T1: place_only_seed, place_only_zscore, density_rel → not; place_pc1 и пять составных → partial_overall; случайные → not в 20 из 20. T5: density_rel и случайные (20 из 20) → not_empty, остальные восемь → not_repeats. Нижняя граница превышения у контролей: ρ (b) от −0,381 до −0,052, ε² от −0,139 до −0,031. Сильнейшие соперники на полной выборке — деление по log_wage_rel для общепита (ρ (b) 0,344) и по log_level_rel для розницы (0,277). Справка self_out: деление по одной log_wage_rel без себя в наборе — partial_one (общепит, нижняя граница +0,035), по log_level_rel — partial_overall (розница, −0,012). Контроли не выше ожидаемого — правило редакции 3 проходит свои контроли; пороги под эти числа не выбирались"
  tests:                    # решающих проверок шесть, T4 — описание; тексты исходов — outcomes
    T1_ladder_external:
      role: decide
      question: "Упорядочены ли типы по ступеням 2 < 1 < 3 < 4 по обороту Росстата, которого нет в кластеризации, — и сверх размера и доли горожан МО относительно региона, и сильнее, чем деления МО по любому одному признаку экономики места или уровню трат?"
      indicators:           # решающие — только обороты Росстата: источник, год, преобразование, ожидаемый знак
        catering: {source: context_annual.catering_turnover_pc, year: 2023, transform: log1p_rel, sign: 1}
                            # оборот общепита Росстата на жителя, без МСП; есть у 1241 узла
        retail: {source: context_annual.retail_pc, year: 2023, transform: log1p_rel, sign: 1}
                            # розничный оборот Росстата на жителя, без МСП; есть у 1705 узлов
      proxies:              # «заместители места» — описание, в подсчёт «за» не входят: их связь с log_pop_rel
                            # и urban_share_rel известна без меток типов (seen_before, ρ 0,30–0,72)
        city_status: {source: territories.mo_type, positive: go, kind: binary, sign: 1}   # городской округ
        capital: {source: territories.is_capital, kind: binary, sign: 1}   # региональная столица (62 узла)
        density: {source: pop_avg/area_km2, year: 2023, transform: log_rel, sign: 1}   # ln плотности минус
                            # медиана группы региона; area_km2 — territories, pop_avg — context_annual
      forbidden: [urban_share_rel, log_pop_rel, market_access_rel, emp_sh_primary, emp_sh_industry,
                  emp_sh_trade_transport, emp_sh_market_services, emp_sh_public, log_wage_rel, ip_per_1000,
                  orgs_per_1000, nights_pc, ndfl_income_pc]   # входят в X или во внешнюю проверку этапа 3;
                            # 5-НДФЛ — по месту работодателя; dist_capital_km не берётся: есть у 1710
                            # из 1774 территориальных узлов
      missing: drop         # пропуск показателя — узел не участвует в этой строке, число узлов публикуется; (a) — все
                            # территориальные узлы с показателем, (b) — ещё и со стратой (interpret.strata)
      overall:              # (a) безусловная версия: ρ Спирмена ранга ступени и показателя по всем узлам
        permutations: 1000  # нуль: перестановки меток внутри групп региона, p двусторонний
        rho_min: 0.10       # |ρ| не меньше
        monotone: nondecreasing_top_gt_bottom   # медианы на трёх парах соседних ступеней не убывают, верхняя
                            # ступень строго выше нижней
      conditional:          # (b) условная версия внутри interpret.strata
        statistic: stratified_spearman   # ρ Спирмена ранга ступени (минус его среднее в страте) и ранга показателя
                            # внутри страты (доли 0–1), по всем узлам
        permutations: 1000  # нуль: перестановки меток внутри страт, p двусторонний
        monotone: nondecreasing_top_gt_bottom   # на медианах внутристратных рангов по ступеням
        beyond_place: true  # ρ (b) типов минус наибольший ρ (b) 25 соперников interpret.place_partitions (ориентация —
                            # place_partitions.orientation) на той же бутстрап-выборке: нижняя граница 95%
                            # бутстрап-интервала больше 0 (бутстрап узлов, все ρ на одной выборке)
      bootstrap: 1000       # 95% интервалы ρ и разностей, бутстрап узлов
      ci_level: 0.95
      fdr: bh               # Бенджамини — Хохберг по двум оборотам, отдельно для (a) и (b)
      alpha: 0.05           # q < alpha
      pairwise: holm        # описание: Манн — Уитни для соседних ступеней с поправкой Холма, бутстрап медиан
      regions_up:           # описание: число групп региона с узлами хотя бы min_steps ступеней, где медиана строго
        indicators: [density, catering, retail]   # растёт по ступеням; нуль — то же число при перестановках меток
        min_steps: 2        # внутри групп региона, односторонний p. Не биномиальный тест против 0,5: при m ступенях
        permutations: 1000  # случайный строгий рост медиан имеет вероятность около 1/m!, а не 0,5
      rule:                 # оборот «за в целом» — (a): знак совпал, |ρ| ≥ rho_min, q < alpha, монотонность;
                            # оборот «за сверх места» — (a) и (b): знак, q < alpha, монотонность, beyond_place
        levels: [not, partial_overall, partial_one, confirmed]   # порядок вердиктов снизу вверх
        confirmed: both_beyond        # оба оборота «за сверх места»
        partial_one: one_beyond       # ровно один оборот «за сверх места»
        partial_overall: any_overall  # ни одного «сверх места», но хотя бы один «за в целом»
        not: none_overall             # ни одного «за в целом»
      outcomes:             # text — для читателя (только он идёт в главный вывод); edits — правила для отчёта и лендинга.
                            # {rho_cond}, {rho_best} — «общепит 0,xx, розница 0,yy»; {best_partition} —
                            # interpret.place_partitions.best_partition для того же оборота
        confirmed:
          text: "Четыре типа — ступени: оборот общепита и розницы Росстата на жителя (без МСП; в кластеризации не участвовал) растёт от ступени к ступени, в том числе внутри страт размера и доли горожан относительно региона, — сильнее, чем у любого деления МО тех же размеров по одному признаку экономики места или уровню трат и чем у групп K-means по признакам места (ρ внутри страт у типов: {rho_cond}; у сильнейшего деления без типов, «{best_partition}»: {rho_best})."
          edits: "Слова «ступени» и «лестница» разрешены."
        partial_one:
          text: "Внутри страт размера и доли горожан относительно региона типы упорядочены по обороту {turnover_beyond} Росстата сильнее, чем любое деление МО без типов (ρ {rho_cond}; у сильнейшего, «{best_partition}», — {rho_best}); {other_clause}"
          other_overall: "по обороту {turnover_other} — только в целом, а внутри страт не сильнее деления «{best_partition_other}» ({rho_best_other})."
          other_none: "по обороту {turnover_other} типы не упорядочены и в целом."   # выбор — по (a) второго оборота
          edits: "Слово «ступени» — только с оговоркой «по обороту {turnover_beyond}»; «лестница» — нет."
        partial_overall:
          text: "Типы упорядочены по обороту {turnovers_overall} Росстата в целом (ρ {rho_overall}), но внутри страт размера и доли горожан относительно региона сильнее деления МО без типов этот порядок не доказан (у типов ρ {rho_cond}; у «{best_partition}» — {rho_best})."
          edits: "В отчёте и на лендинге — «типы, упорядоченные по обороту, как и экономика места»; слов «ступени» и «лестница» нет."
        not:
          text: "Четыре типа корзины трат относительно своего региона по обороту общепита и розницы Росстата не упорядочены даже в целом."
          edits: "Слово «лестница» из тезиса и с лендинга убирается."
        proxies:
          text: "Описание: {proxy_summary}."
          proxy_item: "{proxy} по ступеням снизу вверх — {values}, монотонно: {monotone}"   # values: доли узлов
                            # (статус, столица) или медианы (плотность) по ступеням; monotone — «да» при правиле
                            # overall.monotone, иначе «нет»; элементы через «; »
      circularity: "Статус, столица и плотность — заместители log_pop_rel и urban_share_rel из X, поэтому они только описание. Обороты Росстата тоже растут с урбанизацией и зарплатой: безусловная версия (a) это повторяет, поэтому «ступени» разрешает только условная версия (b), где типы должны превзойти деления без типов по каждому из 11 признаков X (в том числе log_wage_rel и log_level_rel) и K-means по признакам места. T1 (b) и T5 (3) — на одних показателях, стратах и соперниках: это одно свидетельство, а не два. AMI с регионом — около нуля по построению, не проверка."
    T2_direction:
      role: decide
      question: "Идут ли надёжные переходы 2023 → 2024 вверх по порядку типов 2 → 1 → 3 → 4 чаще, чем на псевдогодах без реального времени, и не переклассификация ли это пограничных МО к типу их места?"
      data: "outputs/dynamics/nodes.csv (half_type_2023, half_type_2024, reliable) и outputs/dynamics/labels.csv после перезапуска dynamics"
      year_types: half_types   # тип года — совпавший тип половин (half_type_*): так определены надёжные переходы,
                            # в том числе 8, у которых типы окон 2023 и 2024 годов одни и те же
      up: rank_increase     # «вверх» — ранг ступени назначения выше ранга источника (ladder.order)
      statistic: up_share   # РЕДАКЦИЯ 3: u = вверх / (вверх + вниз) по всем надёжным переходам. В редакции 2 решало
                            # N = 2u − 1 против 95-го перцентиля |N| плацебо, но разброс N ≈ 1/√n, а надёжных переходов
                            # на псевдопаре меньше, чем наблюдаемых: исход решал бы размер плацебо (seen_before, круг 3)
      null: T3_placebo      # те же псевдопары T3: A → B, где A — случайные 6 календарных месяцев 2023 года
                            # и остальные 6 месяцев 2024-го, B — наоборот; надёжные переходы — тем же правилом
                            # stable_halves. p0 — доля «вверх» по всем надёжным переходам всех псевдопар вместе
      test: binomial_one_sided   # «чаще вверх» — P(X ≥ вверх | n, p0) < alpha; «чаще вниз» — P(X ≤ вверх | n, p0) < alpha.
                            # ОГРАНИЧЕНИЕ: биномиальный тест против p0 считает переходы независимыми, хотя псевдопары
                            # строятся на одних и тех же узлах, поэтому интервал p0 уже настоящего. Правило не меняется,
                            # ограничение публикуется в отчёте рядом с p-значением
      min_pool: 100         # при 100 переходах SE(p0) ≤ 0,05. Проверяется отдельно в каждом разбиении половин: надёжных
                            # переходов плацебо вместе меньше 100 — p0 этого разбиения не определена, и разбиение
      p0_undetermined: neither   # не засчитывается ни как «чаще вверх», ни как «чаще вниз» (rule применяется к остальным).
                            # КРУГ 4 (devils-advocate): прежнее запасное p0 = 0,5 мягче известной структурной асимметрии
                            # порядка — из типа 2 путь только вверх, из типа 4 только вниз (маргинальный нуль D2 без
                            # диагонали — 0,785, seen_before). Вариант max(0,5; D2) отвергнут: D2 строится на маргиналях
                            # назначений, которые сами содержат проверяемый перекос, и нуль в запасном случае значил бы
                            # другое, чем «псевдогоды без реального времени». При «не определено» исход «подтвердилась»
                            # недостижим (нужны оба разбиения), «частично» — только по другому разбиению, «значимо вниз»
                            # в другом разбиении по-прежнему даёт down: это строже любого запасного p0
      halves: [main, sensitivity]   # половины odd_even и T3.halves_sensitivity; в чувствительности и наблюдаемая доля,
                            # и p0 пересчитываются на тех же половинах
      alpha: 0.05
      bootstrap: 1000       # 95% интервал u и N — бутстрап узлов среди надёжных переходов
      ci_level: 0.95
      describe:             # описание, в вердикт не входит
        net_flow: "N = (вверх − вниз) / (вверх + вниз), 95-й перцентиль |N| по псевдопарам, число надёжных переходов плацебо (всего и медиана на псевдопару), z = (N − (2·p0 − 1)) / (2·√(p0·(1 − p0) / n))"
        per_pair: "n_ij против n_ji для соседних ступеней (2–1, 1–3, 3–4), как в критерии симметрии Боукера, с 95-м перцентилем |N| той же пары на плацебо"
        d1_noise: "доля «вверх» среди надёжных переходов минус доля «вверх» среди смен «нечётные → чётные» одного года (ориентация — src/munnet/dynamics/compute.py, events_table), среднее 2023 и 2024 годов; в чувствительности — обратная ориентация «чётные → нечётные». Направление шума — условность кода, поэтому D1 не решает"
        d2_permutation: "перестановки типов назначения с сохранением маргиналей: публикуются оба прочтения — диагональ вне знаменателя и диагональ как «не вверх» (ожидания — seen_before). Маргиналь назначений сама содержит проверяемый перекос, поэтому D2 не решает"
      place_tree:           # (c) альтернатива «переходят пограничные МО к типу своего места»
        features: [log_wage_rel, urban_share_rel, age_old_share_rel, log_pop_rel, market_access_rel,
                   emp_sh_primary, emp_sh_industry, emp_sh_trade_transport, emp_sh_market_services,
                   emp_sh_public]   # 10 признаков места X без log_level_rel, год place_year
        target: type_2023   # дерево учится на типах окна 2023 года, прогноз — вне фолда
        depth: 3
        class_weight: balanced
        folds: 5            # стратифицированные, seed
        statistic: movers_to_place_type   # S — число перешедших, у которых прогноз по месту равен типу назначения;
                            # публикуются доля A = S / число перешедших и её среднее на нуле
        null: permute_within_source   # нуль: перестановки статуса «остался / перешёл в d» внутри исходного типа
                            # (число переходов каждого потока сохраняется): перешедшие против неперешедших того же
                            # исходного типа, односторонний p (S больше, чем на нуле)
        permutations: 1000
        alpha: 0.05
      rule:
        levels: [down, not, partial, confirmed]
        confirmed: both_halves   # «чаще вверх» в обоих разбиениях половин
        partial: one_halves      # в одном из двух
        down: down_any           # «чаще вверх» — ни в одном, «чаще вниз» — хотя бы в одном
        not: otherwise           # ни того, ни другого
        place_cap: partial       # p < alpha у place_tree — вердикт не выше «частично»: при both_halves — текст
                            # partial_capped, при one_halves — partial; к тексту дописывается place_override
      direction_words:      # слова о направлении в T2 (в T6 с поправки 30.09.2026 не используются, texts.ALLOWED_FIELDS)
                            # зависят от вердикта T1 (после R1 и thesis_assembly.t1_cap_by_t5)
        t1_confirmed: "к городской корзине"
        otherwise: "к типам с большей долей общепита в корзине относительно своего региона"
      outcomes:             # text — для читателя; числа — основного разбиения половин, чувствительность — в отчёте
        confirmed:
          text: "Надёжные переходы чаще идут {direction}, чем на псевдогодах без реального времени: вверх {n_up}, вниз {n_down} (доля «вверх» {share_up} против {p0} на плацебо) — при обоих разбиениях половин."
        partial_capped:
          text: "Надёжные переходы чаще идут {direction}, чем на псевдогодах без реального времени (вверх {n_up}, вниз {n_down}; доля «вверх» {share_up} против {p0}), при обоих разбиениях половин, но часть их — пограничные МО, чья корзина сблизилась с типом их места."
        partial:
          text: "Переходы чаще идут {direction}, чем на плацебо, лишь при разбиении половин {passed_halves} (доля «вверх» {share_up} против {p0}); при другом разбиении{other_halves}: преобладание направления не доказано."
          other_halves:     # вставка — по исходу второго разбиения; {share_up} и {p0} в text — того разбиения, где
                            # направление доказано (у второго p0 может быть не определена)
            not: " — нет"
            down: " — значимо вниз"
            undetermined: " — не определено: надёжных переходов плацебо {n_pool}, меньше {min_pool}"
        not:
          text: "Надёжных переходов вверх {n_up}, вниз {n_down}; доля «вверх» {share_up} против {p0} на псевдогодах без реального времени — отличие от плацебо не доказано."
          p0_undetermined: "доли, которую не из чего оценить (надёжных переходов плацебо {n_pool}, меньше {min_pool})"
                            # подставляется вместо {p0}, если p0 основного разбиения не определена (min_pool)
        down:
          text: "Надёжные переходы идут вниз по порядку типов чаще, чем на псевдогодах без реального времени (доля «вверх» {share_up} против {p0})."
                            # {share_up} и {p0} — основного разбиения, если «значимо вниз» в нём, иначе — второго
          edits: "Слова о движении к городской корзине из тезиса и с лендинга убираются."
        place_override:
          text: "Прогноз типа по признакам места 2023 года совпадает с типом назначения у {share_a} перешедших против {share_null} на нуле."
      circularity: "Направление известно заранее: сырая асимметрия 148 вверх против 33 вниз опубликована (seen_before), и никакое правило не сделает её новым результатом. Новое в T2 — только сравнение с плацебо, проверка (c) place_tree и устойчивость в R1. Признаки места во всех окнах — 2023 год (dynamics.tracking.place_year), поэтому (c) нацелена на альтернативу «переклассификация к типу места»."
    T3_reliable_placebo:
      role: decide
      question: "Надёжных переходов больше, чем даёт то же правило на псевдогодах без реального времени между ними?"
      reuse: munnet.dynamics   # refit_match и stable_halves — функции этапа dynamics; его выходы не меняются
      pseudo_pairs: 200     # псевдогод А — случайные 6 календарных месяцев 2023 года и остальные 6 месяцев 2024-го,
                            # псевдогод Б — наоборот; в каждом все 12 календарных месяцев. Те же псевдопары — нуль T2
      halves: odd_even      # половины внутри псевдогода — нечётные и чётные календарные месяцы, как в основном расчёте
      halves_sensitivity: [[1, 2, 5, 6, 9, 10], [3, 4, 7, 8, 11, 12]]   # чувствительность: месяцы парами (ноябрь
                            # с декабрём и январь с февралём — в одной половине). В черновике 29.09 стояло «11 и 12,
                            # 1 и 2 — в разных половинах», но это и есть odd_even: заменено до расчётов
      observed_sensitivity: recompute   # в чувствительности наблюдаемое число надёжных переходов пересчитывается
                            # на тех же половинах; в текст идёт n_reliable основного разбиения, чувствительность — рядом
      percentile: 95        # наблюдаемое число выше этого перцентиля плацебо того же разбиения половин
      excess: median        # избыток = n_reliable − медиана плацебо; 95% интервал — n_reliable минус 97,5-й и 2,5-й
                            # перцентили плацебо; публикуется во всех исходах, в числе МО и в доле узлов
      one_in_ten: [0.09, 0.11]   # фраза «каждое десятое МО» — только если доля избытка (а не сырая доля) в этих
                            # пределах; иначе — избыток в процентах узлов. Вставка {one_in_ten_phrase}: «— примерно
                            # каждое десятое МО» или пусто
      denominator: all_nodes   # {share} и {excess_share} — от числа узлов этапа dynamics (1776 при записи; узлы-города
                            # типизированы, как все, и тоже могут сменить тип), а не от 1774 территориальных
      rule:
        levels: [not, partial, confirmed]
        confirmed: both_halves   # выше 95-го перцентиля в основном расчёте и в чувствительности
        partial: one_halves      # только в одном из двух разбиений половин
        not: no_halves           # ни в одном
      outcomes:
        confirmed:
          text: "За год надёжно сменили тип {n_reliable} МО ({share}); на псевдогодах без реального времени то же правило даёт медиану {placebo_median} (95-й перцентиль {p95}). Сверх плацебо — {excess} МО ({excess_share}, интервал {excess_ci}){one_in_ten_phrase}."
        partial:
          text: "Надёжных переходов {n_reliable}; выше плацебо — только при разбиении половин {passed_halves}. Сверх плацебо — {excess} МО (интервал {excess_ci}), ожидаемо ложных ≈ {placebo_median}."
          edits: "Фразы «каждое десятое МО» в тезисе нет."
        not:
          text: "Надёжных переходов {n_reliable}, ожидаемо ложных ≈ {placebo_median} (медиана плацебо), избыток {excess} (интервал {excess_ci}): число смен типа не отличается от плацебо."
          edits: "Утверждение «каждое десятое МО надёжно сдвинулось» из тезиса и с лендинга убирается."
      circularity: "181 и 10,2% — в seen_before; порог — перцентиль плацебо, а не число, выбранное под 181; «каждое десятое» — по избытку сверх плацебо."
    T4_basket_vs_place:
      role: describe        # исход известен до записи (seen_before: ARI 0,94 и 0,16), в подтверждения не идёт
      question: "Насколько итог ближе к разбиению по одной корзине, чем по одним признакам места?"
      basket: {method: spectral_embedding_kmeans, graph: network_edges.basket_dist, dim: 4, k: 4}
                            # вложение G (нормированный лапласиан) размерности K и K-means
      place: {method: kmeans, features: interpret.tests.T2_direction.place_tree.features, scale: robust, k: 4}
                            # 10 признаков места X без log_level_rel, стандартизация как clustering.inputs.scale
      n_init: 20            # запусков K-means (как clustering.impl.kmeans_n_init)
      statistic: ari_diff   # ARI(итог, корзина) − ARI(итог, место)
      bootstrap: 200        # подвыборки 80% узлов без возвращения, оба метода перезапускаются
      subsample: 0.8
      ci_level: 0.95
      describe: [ari_log_pop_rel_quintiles, basket_only_order_by_turnovers]   # ARI с квинтилями log_pop_rel;
                            # правило T1 (обе версии) на разбиении «только корзина» — тоже описание: при ARI 0,94
                            # с итогом оно повторяет T1 и второго подтверждения не даёт
      text: "Описание, не проверка: итог ближе к разбиению по одной корзине (ARI {ari_basket}), чем по одним признакам места (ARI {ari_place}); разность {diff}, интервал {ci}. Это следует из построения и было известно до проверок. Описывает ли экономика места типы — T1 и T5 (3)."
      circularity: "Итог (гибрид) содержит оба источника, а ARI 0,94 и 0,16 опубликованы до записи: вердикта нет."
    T5_trivial:
      role: decide
      question: "Не повторяют ли типы тривиальные деления — размер, долю горожан и доступность рынков относительно региона, статус МО, федеральный округ, покрытие данных, любой один признак X, K-means по признакам места — и различаются ли они по обороту Росстата сильнее, чем такие деления?"
      partitions:           # имя -> определение; все — на территориальных узлах
        pop_decile: {source: context_annual.pop_avg, year: 2023, groups: 10}
        urban_group: {source: context_annual.urban_share, year: 2023, groups: 10, missing: own_group}
                            # абсолютная доля; совпадающие границы квантилей сливаются (групп может быть меньше 10);
                            # пропуск (47 узлов) — отдельная группа
        mo_type: {source: territories.mo_type}
        federal_district: {source: interpret.federal_districts}
        coverage_class: {columns: [wage, urban_share, age_old_share, emp_sh_primary, retail_pc,
                                   catering_turnover_pc, shipments_pc, invest_krub, nights_pc, beds_per_1000,
                                   ndfl_income_pc], year: 2023, classes: missing_count}
                            # РЕДАКЦИЯ 3: класс по числу пропущенных показателей узла — 0 / 1 / 2 и больше (явные
                            # границы). Терцили числа показателей из-за совпадений давали 2 группы (seen_before, круг 3);
                            # ip_per_1000 и orgs_per_1000 убраны — в 2023 году пусты у всех узлов
        place_partitions: {source: interpret.place_partitions.sized}   # 24 деления без типов с размерами типов
        place_only: {source: interpret.place_partitions.place_only}   # K-means по 10 признакам места, K = 4
      region_by_construction: true   # AMI с группой региона публикуется с пометкой «около нуля по построению»
      ami_max: 0.30         # (1) AMI типов с каждым делением меньше. ПРАВИЛО ПРОЕКТА, не норма литературы;
                            # AMI и ARI со всеми делениями публикуются при любом исходе
      composition:          # ОПИСАНИЕ (редакция 3; в редакции 2 — условие (2)): в каждой группе urban_group (кроме
        min_types: 3        # пропусков) число типов с долей не меньше min_share узлов группы. Контроль без меток показал,
        min_share: 0.05     # что его выполняют и деления без типов — по размеру, по зарплате, place_only (seen_before,
                            # круг 3): тип от тривиального деления оно не отличает
      stratified:           # (3) внешние показатели внутри interpret.strata (относительные, как в X)
        indicators: [catering, retail]   # как в T1 (log1p_rel, place_year)
        statistic: kw_epsilon2_within_strata   # ранги показателя внутри страты (interpret.strata.within_rank),
                            # ε² Краскела — Уоллиса по типам на всех узлах со стратой, 95% бутстрап-интервал
        permutations: 1000  # перестановки меток внутри страт
        bootstrap: 1000
        beyond_place: true  # ε² типов минус наибольший ε² 25 соперников interpret.place_partitions на той же
                            # бутстрап-выборке: нижняя граница 95% бутстрап-интервала больше 0
        fdr: bh             # поправка Бенджамини — Хохберга на 2 показателя
        alpha: 0.05         # (3) выполнено, если хотя бы у одного показателя q < alpha и beyond_place
      rule:                 # РЕДАКЦИЯ 3: два условия, (1) и (3), — у каждого из 4 сочетаний свой текст
        levels: [not_repeats, not_empty, partial, confirmed]
        confirmed: one_and_three      # выполнены (1) и (3)
        partial: three_not_one        # (3) выполнено, (1) нет
        not_empty: one_not_three      # (1) выполнено, (3) нет
        not_repeats: neither          # ни (1), ни (3)
      outcomes:             # {max_partition} и {max_ami} — деление с наибольшим AMI; {best_partition} и {eps2_best} —
                            # соперник с наибольшим ε² (place_partitions.best_partition); {eps2} — у типов
        confirmed:
          text: "Типы не повторяют ни размер, ни долю горожан, ни доступность рынков, ни статус МО, федеральный округ, покрытие данных или один признак экономики места (наибольший AMI — {max_ami}, с делением «{max_partition}»); внутри страт размера и доли горожан относительно региона они различаются по обороту {turnovers} Росстата сильнее любого из этих делений (ε² {eps2}; у «{best_partition}» — {eps2_best})."
        partial:
          text: "Внутри страт размера и доли горожан относительно региона типы различаются по обороту {turnovers} Росстата сильнее любого деления без типов (ε² {eps2}; у «{best_partition}» — {eps2_best}), но по составу близки к делению «{max_partition}» (AMI {max_ami})."
        not_empty:
          text: "Типы не повторяют тривиальных делений (наибольший AMI — {max_ami}, с «{max_partition}»), но внутри страт размера и доли горожан по обороту Росстата различаются не сильнее, чем деление «{best_partition}» (ε² {eps2} против {eps2_best}): отличие типов — в корзине трат, внешним оборотом оно не подтверждено."
        not_repeats:
          text: "Типы по составу близки к делению «{max_partition}» (AMI {max_ami}) и внутри страт размера и доли горожан по обороту Росстата различаются не сильнее, чем деление «{best_partition}» (ε² {eps2} против {eps2_best})."
          edits: "Главный тезис переформулируется: корзина трат уточняет деление «{max_partition}»."
      circularity: "Доля горожан, население, доступность рынков и остальные признаки X входят в кластеризацию: по ним — только AMI и состав, без p-значений. Проверка (3) — на показателях вне X и G и против делений без типов по каждому признаку X и K-means по месту, иначе её проходят и деление по одному размеру (круг 2), и по одной зарплате (круг 3, seen_before). T5 (3) и T1 (b) — одно свидетельство."
    T6_bank_coverage:
      role: decide
      question: "Виден ли главный признак переходов вверх по порядку типов — рост доли общепита — и вне данных банка, в обороте общепита Росстата?"
      indicator: {source: context_annual.catering_turnover_pc, transform: log1p_rel}   # без МСП; оба года — у 1115 узлов
      change: diff          # Δ log1p_rel 2023 → 2024 (change_years)
      movers: [[2, 1], [1, 3]]   # надёжные переходы вверх с двух нижних ступеней (номера типов, ladder.order)
      stayers: same_source_type_unchanged   # неперешедшие: half_type_2023 = half_type_2024 = исходный тип (2 или 1)
                            # и reliable = false — по тем же половинам, что и перешедшие, поэтому в обе группы узел
                            # не попадает (редакция 3; в редакции 2 — по типам окон)
      strata: source_type   # сравнение только внутри исходного типа: состав перешедших (74 из типа 2, 55 из типа 1)
                            # и оставшихся различается, объединение смешало бы тип источника с переходом
      cliff: within_source_pairs   # δ = Σ_s n_m,s·n_st,s·δ_s / Σ_s n_m,s·n_st,s — только пары одного исходного типа
      test: stratified_permutation_greater   # перестановки статуса «перешёл / остался» внутри исходного типа,
      permutations: 1000    # статистика — δ по парам внутри типа, односторонний p
      alpha: 0.05
      cliff_bootstrap: 1000 # 95% интервал δ, бутстрап внутри исходного типа и группы
      ci_level: 0.95
      per_flow: describe    # по каждому потоку отдельно — описание
      coverage_caveat:      # оговорка про охват безнала: ε² Краскела — Уоллиса по типам для log_level_rel −
        epsilon2_max: 0.06  # log_ndfl_rel (узлы с ndfl_ok, place_year), без p-значений; больше — оговорка в текст
      rule:
        levels: [not, partial, confirmed]
        confirmed: p_and_cliff   # p < alpha и нижняя граница δ > cliff_lower_min
        partial: one_of_two      # одно из двух
        not: none                # ни одного
        cliff_lower_min: 0.0
      outcomes:                 # {flows} — потоки movers словами («из типа 2 в тип 1 и из типа 1 в тип 3»), код
                            # texts.flows_text; {direction} в T6 не допускается (texts.ALLOWED_FIELDS)
        # ПОПРАВКА 30.09.2026 до вскрытия результатов: изменён текст исходов confirmed, partial и not, правило
        # не менялось; было: «Сдвиг {direction} виден и вне данных банка: оборот общепита Росстата на жителя
        # у перешедших МО рос быстрее, чем у оставшихся того же исходного типа (дельта Клиффа {delta}, интервал
        # {ci}).» / «В обороте общепита Росстата сдвиг {direction} виден слабо (p = {p}, дельта Клиффа {delta},
        # интервал {ci}); распространение безналичной оплаты как объяснение не исключено.» / «Сдвиг {direction}
        # виден в безналичных тратах; в обороте общепита Росстата (без МСП) — нет. Распространение безналичной
        # оплаты как объяснение не исключено.»; почему: текст T6 стоит на экране 0 при любом исходе
        # (thesis_assembly.caveat) и утверждал «сдвиг {direction}» как общий вывод — при T3 not выходило «смен
        # типа не больше плацебо… Сдвиг виден», при T2 down — «сдвиг к городской корзине» рядом с «вниз чаще»;
        # T6 сравнивает только МО потоков movers с оставшимися того же исходного типа, и новый текст говорит
        # только это (devils-advocate, 30.09). Список «было → стало» — interpret/amendments.py и отчёт этапа
        confirmed:
          text: "У МО, надёжно перешедших {flows}, оборот общепита Росстата на жителя рос быстрее, чем у оставшихся того же исходного типа (дельта Клиффа {delta}, интервал {ci}): отличие перешедших видно и вне данных банка."
        partial:
          text: "В обороте общепита Росстата на жителя отличие МО, надёжно перешедших {flows}, от оставшихся того же исходного типа видно слабо (p = {p}, дельта Клиффа {delta}, интервал {ci}); распространение безналичной оплаты как объяснение их смены типа не исключено."
        not:
          text: "У МО, надёжно перешедших {flows}, отличие от оставшихся того же исходного типа видно в безналичных тратах; в обороте общепита Росстата на жителя (без МСП) — нет. Распространение безналичной оплаты как объяснение их смены типа не исключено."
        caveat:
          text: "Типы частично могут отражать охват безналичной оплаты: отношение трат к доходу 5-НДФЛ различается по типам (ε² = {eps2})."
      circularity: "log_level_rel входит в X, поэтому оговорка — описание, а не проверка. Отношение медиан изменения общепита 2,11 — в seen_before. Мощность мала: оборот без МСП, пропуски у 37% узлов."
    T7_utility:
      role: decide
      question: "Предсказывают ли «сопоставимые территории» изменение экономики МО лучше соседей по региону и случайных МО того же размера — и добавляет ли что-то ограничение «того же типа»?"
      basket: [clr_rel_food, clr_rel_marketplace, clr_rel_transport, clr_rel_health, clr_rel_cafe,
               clr_rel_other, log_level_rel]   # окно year_a (без утечки 2024 года), евклидово расстояние
      scale: robust         # 7 признаков расстояния — (x − медиана) / (MAD × 1,4826) по узлам, как clustering.inputs.scale
      other_regions: region_group   # «другие регионы» — другая группа региона (Москва с Московской областью, Петербург
                            # с Ленинградской — одна группа), как у B
      type_label: type_2023 # outputs/dynamics/nodes.csv
      k: 10                 # МО в каждом наборе
      min_set: 5            # у набора меньше — МО выбывает из сравнения, число выбывших публикуется
      common_set: true      # A, B, C, D сравниваются на одних МО — тех, у кого все четыре набора не меньше min_set
      sets:
        A: {rule: nearest_basket, same_type: true, other_regions: true}    # «сопоставимые территории»
        B: {rule: nearest_geo, own_region: true}   # ближайшие по x_aea, y_aea в своей группе региона
        C: {rule: random, same_pop_decile: true, other_regions: true, draws: 100}   # случайные того же дециля
                            # населения; 100 розыгрышей от seed, ошибка МО — медиана по розыгрышам
        D: {rule: nearest_basket, same_type: false, other_regions: true}   # абляция: без ограничения типом
      target: {source: context_annual.retail_pc, transform: log1p_rel, change: diff}   # Δ 2023 → 2024; оба
                            # года — у 1569 узлов; члены набора — только с известной целью
      target_abs: {source: context_annual.retail_pc, transform: log1p, change: diff}   # вариант без относительности:
                            # у B цель центрирована той же медианой региона, что у самого МО, и B проигрывает отчасти
                            # по построению; сравнение с B решается только по обоим вариантам
      error: abs_median     # ошибка МО = |y − медиана y набора|; сводка — медиана по МО
      bootstrap: 1000       # парный бутстрап МО для разностей медианных ошибок (B − A), (C − A), (D − A)
      ci_level: 0.95
      beyond_place:         # (b) публикуется при любом исходе: ΔR² на перекрёстной проверке от меток type_2023
        features: interpret.tests.T2_direction.place_tree.features   # сверх 10 признаков места, та же цель
        folds: 5
        repeats: 20
        permutations: 1000  # перестановки меток типа
      example: median_error_product   # пример для лендинга — МО с медианной ошибкой набора продукта
                            # (rule.product_set); при равенстве — меньший territory_id; регион указывается всегда
      rule:
        levels: [not, partial, confirmed]
        against_B: both_targets   # «лучше B»: нижняя граница (B − A) > lower_min и в target, и в target_abs
        against_C: main_target    # «лучше C»: нижняя граница (C − A) > lower_min в target
        confirmed: both           # лучше B и лучше C
        partial: one              # одно из двух
        not: none
        lower_min: 0.0
        type_gain:          # слова о типе в пользе («сопоставимые территории того же типа») — по (D − A), при любом
          adds: lower_gt_0  # вердикте: нижняя граница > 0; neutral — интервал содержит 0; hurts — верхняя < 0
        product_set: by_type_gain   # набор продукта — A при type_gain = adds, иначе D; вердикт пользы (against_B,
                            # against_C) в главный вывод — по набору продукта; вердикт по A публикуется рядом.
                            # {set_name} — «сопоставимые территории того же типа» (A) или «сопоставимые территории» (D)
      outcomes:             # {err_P} — медианная ошибка набора продукта
        # ПОПРАВКА 30.09.2026 до вскрытия результатов: изменён текст исходов confirmed, partial и not (поля text),
        # правило не менялось; было: «{set_name} из других регионов предсказывают изменение розничного оборота
        # 2023 → 2024 точнее, чем соседи по своему региону и случайные МО того же размера (медианная ошибка
        # {err_P} против {err_B} и {err_C}).» / «{set_name} точнее, чем {passed_set}, но не точнее, чем
        # {failed_set}: как ориентир для сравнения — да, как прогноз — нет.» / «Подбор сопоставимых территорий —
        # описательный инструмент: изменение розничного оборота он предсказывает не лучше соседей по региону
        # и случайных МО того же размера.»; почему: цель T7 — изменение за тот же период 2023 → 2024, что и у
        # самого МО, это сверка, а не опережающий прогноз; «предсказывают», «как прогноз», «предсказывает»
        # утверждали больше проверенного (devils-advocate, 30.09). Поля edits не менялись. Список «было → стало» —
        # interpret/amendments.py и отчёт этапа
        confirmed:
          text: "{set_name} из других регионов точнее, чем соседи по своему региону и случайные МО того же размера, при сверке изменения розничного оборота 2023 → 2024 у самого МО с медианой его набора за тот же период (медианная ошибка {err_P} против {err_B} и {err_C}); это сверка, а не опережающая оценка."
        partial:
          text: "{set_name} точнее, чем {passed_set}, но не точнее, чем {failed_set}, при сверке изменения розничного оборота 2023 → 2024 у самого МО с медианой его набора за тот же период: это ориентир для сравнения, а не опережающая оценка."
          edits: "Обещаний прогноза нет ни в отчёте, ни на лендинге."
        not:
          text: "Подбор сопоставимых территорий — описательный инструмент: при сверке изменения розничного оборота 2023 → 2024 у самого МО с медианой его набора за тот же период он не лучше соседей по региону и случайных МО того же размера."
          edits: "Обещаний прогноза нет ни в отчёте, ни на лендинге."
        type_adds:
          text: "Ограничение «того же типа» уточняет подбор: без него ошибка больше (D − A = {d_minus_a}, интервал {ci_d})."
        type_neutral:
          text: "Тип при подборе ничего не добавляет: ближайшие по корзине МО из других регионов без учёта типа дают ту же ошибку (D − A = {d_minus_a}, интервал {ci_d})."
          edits: "В продукте — подбор по корзине, тип — подпись; слов о пользе типа нет."
        type_hurts:
          text: "Без ограничения типом подбор точнее (D − A = {d_minus_a}, интервал {ci_d})."
          edits: "В продукте — ближайшие по корзине без типа; слов о пользе типа нет."
      circularity: "Розница Росстата не входит ни в X, ни в G, ни во внешнюю проверку этапа 3; тип — по окну 2023 года, цель — изменение к 2024 году."
  robustness:               # R1 — фильтр, не проверка тезиса: в главные выводы — только устойчивые утверждения
    variants: [graph_basket_cos, no_level, nodes_separate]   # все три clustering.selection.sensitivity.variants;
                            # итоговый метод (гибрид, K = 4) на входах варианта; nodes_separate — на общих узлах.
                            # РЕДАКЦИЯ 3: no_level (без log_level_rel) в редакции 2 выпал без причины, а именно он
                            # проверяет, держатся ли ступени без уровня трат. Соперники T1 (b) и T5 (3) во всех
                            # вариантах — те же 25 делений place_partitions (с log_level_rel)
    tracking: [fixed_prototypes, evolutionary]   # dynamics.tracking.alternatives — для t2_verdict и t3_verdict
    seeds: [42, 142, 242, 342, 442]   # разнесены: гибрид берёт лучший из seed … seed + 9 (clustering.protocol.seeds),
                            # и у seed 42–46 эти окна пересекались на 6–9 значений — проверка была бы почти пустой
    match: hungarian_jaccard   # типы варианта сопоставляются с итогом по Жаккару узлов, ступени — по сопоставлению
    statements: [basket_sign, t1_verdict, t2_verdict, t3_verdict]   # знак отклонения медианы каждой части корзины
                            # у типа от общей медианы (6 × 4 утверждений) и вердикты T1, T2, T3; T2 и T3 — с тем же
                            # числом псевдопар T3.pseudo_pairs
    variants_required: all  # знак сохраняется, вердикт не ниже основного — во всех вариантах и способах прослеживания
    seeds_required: 4       # и не меньше чем в 4 из 5 seed
    main_text: lowest       # РЕДАКЦИЯ 3, одно правило. В главный вывод — текст наименьшего вердикта среди основного
                            # расчёта, вариантов, способов прослеживания и 4-го по величине из 5 seed; числа текста —
                            # из прогона, давшего этот вердикт (при равенстве — основной расчёт, затем порядок variants,
                            # tracking, seeds). T5, T6 и T7 в statements не входят — у них основной расчёт
    main_run_verdict: check_section   # вердикт и числа основного расчёта, если он выше наименьшего, — в разделе
                            # проверки с пометкой unstable_label; в главный вывод и в ограничения не переносятся
    unstable_label: "неустойчиво к правилу рёбер, составу узлов, уровню трат в X, способу прослеживания или seed"
    basket_sign_unstable: limitations   # часть корзины, у которой знак отклонения типа не прошёл R1, — в ограничения
                            # и не в название (naming.unstable_parts)
    circularity: "ARI вариантов (0,22 и 0,32) известен, поэтому порог на ARI не ставится: фильтруются знаки и вердикты."
  naming:                   # название — после профиля, по правилу; отличие от тезиса — меняется текст
    basket_parts: 2         # две из шести частей корзины (features.space.edges) с наибольшим |отклонением медианы|
                            # в единицах MAD × 1,4826
    place_features: 1       # и один из 10 признаков места (T2_direction.place_tree.features, без log_level_rel)
    weights: none           # отклонения и дельты Клиффа для названия — без весов («типичное МО»); pop_avg — только
                            # в профиле рядом
    min_abs_cliff: 0.15     # признак с |дельтой Клиффа| меньше в название не идёт (ПРАВИЛО ПРОЕКТА); не нашлось
                            # ни одной части корзины — «без выраженных отличий корзины»; ни один признак места не прошёл
                            # и слова о поселении нет — в названии только части корзины
    unstable_parts: skip    # часть корзины, у которой знак не прошёл R1 (robustness.basket_sign_unstable), в название
                            # не идёт: берётся следующая по |отклонению|
    words: [2, 4]           # обычных слов в названии; предлоги и союзы не считаются. Больше 4 — признак места
                            # заменяется словом о поселении, если оно есть, иначе опускается
    duplicates: add_part_2  # у двух типов одно название — к обоим добавляется часть корзины 2 (ограничение words
                            # на них не действует); совпадение осталось — «Тип {n}: …» по test.fallback
    assembly: "{слово о поселении или признак места}, {часть корзины 1}; часть корзины 2 — в подписи"
    qualifier: "относительно своего региона"   # оговорка обязательна в подписи типа
    dictionary:             # признак и знак отклонения медианы типа -> слова; других слов в названии нет
      clr_rel_food: {pos: "больше продуктов", neg: "меньше продуктов"}
      clr_rel_marketplace: {pos: "больше маркетплейсов", neg: "меньше маркетплейсов"}
      clr_rel_transport: {pos: "больше транспорта", neg: "меньше транспорта"}
      clr_rel_health: {pos: "больше медицины", neg: "меньше медицины"}
      clr_rel_cafe: {pos: "больше общепита", neg: "меньше общепита"}
      clr_rel_other: {pos: "больше прочих трат", neg: "меньше прочих трат"}
      log_wage_rel: {pos: "выше зарплаты", neg: "ниже зарплаты"}
      urban_share_rel: {pos: "больше горожан", neg: "меньше горожан"}
      age_old_share_rel: {pos: "старше", neg: "моложе"}
      log_pop_rel: {pos: "крупные", neg: "небольшие"}
      market_access_rel: {pos: "ближе к рынкам", neg: "дальше от рынков"}
      emp_sh_primary: {pos: "аграрные и добывающие", neg: "неаграрные"}
      emp_sh_industry: {pos: "промышленные", neg: "непромышленные"}
      emp_sh_trade_transport: {pos: "торговые и транспортные", neg: "меньше торговли"}
      emp_sh_market_services: {pos: "больше услуг", neg: "меньше услуг"}
      emp_sh_public: {pos: "больше бюджетников", neg: "меньше бюджетников"}
    settlement_words:       # слова о типе поселения — только при выполненном условии на составе типа; слово заменяет
                            # признак места
      large_cities: {mo_type: go, pop_min: 100000, share_min: 0.5, compare_with: lower}   # «крупные города»;
                            # узлы-города (mo_type = city) засчитываются как go с pop_avg ≥ 100 000
      cities: {urban_share_min: 0.5, share_min: 0.5, compare_with: lower}   # «города»: абсолютная доля горожан
      rural: {urban_share_below: 0.5, share_min: 0.5, compare_with: upper}  # «сельские»; пропуски доли горожан
                            # публикуются отдельно
      # compare_with: доля узлов, выполняющих условие, у типа выше, чем у соседней ступени снизу (lower) или сверху
      # (upper) по ladder.order; у ступени без такого соседа слово не ставится
      priority: [large_cities, cities, rural]   # подошло несколько — первое по списку; слово о поселении одно
    banned: ["районные центры", "туризм", "курорт", "приезжие", "жители тратят"]   # узел — МО целиком, не его
                            # центр; траты приезжих в данных не видны; писать «в МО типа … в среднем»
    test:                   # слепая проверка названий. РЕДАКЦИЯ 3: в редакции 2 check-ux угадывал знак, написанный
                            # в самом названии, — проверка проходила по построению
      who: check-ux         # получает 4 названия и 4 профиля без названий и номеров, перемешанных seed (медианы
                            # и межквартильные размахи 17 признаков, доли статусов МО), и сопоставляет их
      pass_min: 4           # верно сопоставлено меньше 4 из 4 — все названия заменяются описательными (fallback)
      fallback: "Тип {n}: {часть корзины 1}, {часть корзины 2}"
  examples:                 # выбор без ручных замен; не понравился пример — меняется текст, а не пример
    space: hybrid_input     # стандартизованное пространство итогового гибрида (вложение G ⊕ X, как у K-means)
    typical: 3              # на тип — ближайшие к центроиду типа, ранг расстояния публикуется
    borderline: 2           # на тип — наименьшая разность расстояний до двух ближайших центроидов, со вторым типом
    largest: 1              # на тип — крупнейшее по pop_avg, с подписью «крупнейшее», а не «типичное»
    one_per_region: true
    exclude_city_nodes: true   # узлы-города показываются отдельно
    tie: min_territory_id
    unstable_type_jaccard: 0.75   # тип с Жаккаром ниже (cluster_final.type_jaccard, одно значение на тип) —
                            # примеры помечаются «тип неустойчив». Порог — clustering.stability.jaccard_stable
                            # (Hennig, 2007), а не выбор этапа 5; при известных 0,90–0,94 пометки не будет, и поднимать
                            # порог под эти числа нельзя: пометка — страховка на случай перезапуска cluster
    flows:                  # примеры переходов — заменяют dynamics.impl.examples в тексте этапа 5
      min_nodes: 10         # только потоки не меньше чем из 10 надёжных переходов
      per_flow: 3           # ближайшие к медианному вектору изменения потока (6 частей clr_rel и log_level_rel)
      one_per_region: true
    flag_workplace_based: true   # помечать, а не исключать молча
    show_region: true
    exceptions:             # исключение внутри типа — описание: силуэт < 0 в пространстве гибрида или ошибка
      silhouette_below: 0.0 # дерева вне фолда; доля по типам и 5 крупнейших по населению с регионом
      top: 5
  tree:                     # описание типов правилами — только описание, без порога «прошло» (каппа 0,89 известна)
    features: [edges, attributes]   # 17 признаков, как clustering.interpretability.inputs
    depth: 3
    class_weight: balanced
    folds: 5                # стратифицированные, seed
    baselines: [majority, balanced_random]   # самый частый класс и 0,25 при сбалансированном случайном
    collapse_same_class: true   # разбиение, обе ветви которого ведут в один класс, сворачивается
    rules_per_type: [1, 2]  # правил «если …, то тип» с покрытием и точностью; словами для журналиста — одно на тип
    journalist_rule: max_type_nodes   # лист с наибольшим числом узлов типа, при равенстве — с большей точностью
    fca:                    # формальные понятия, своя реализация на numpy
      binarize: terciles    # каждый из 17 признаков -> «низкий», «средний», «высокий» по терцилям узлов
      max_itemset: 3        # замкнутые наборы до 3 бинарных признаков
      precision_min: 0.8    # импликация «набор ⇒ тип»: точность не меньше
      coverage_min: 0.3     # и покрытие не меньше доли узлов типа — параметры отбора, а не проверка
      bootstrap: 200        # устойчивость — доля бутстрап-выборок, где импликация сохраняет оба порога
      stable_share: 0.8     # в текст — импликации с долей не меньше
  thesis_assembly:          # главный вывод — вопрос и три пункта из полей text исходов, без новых слов; поля edits
                            # в главный вывод не входят (это правила для отчёта и лендинга). Состав и порядок не зависят
                            # от исходов; вердикт каждого теста — по robustness.main_text
    question: "Какие типы локальных экономик видны в корзине безналичных трат жителей относительно своего региона, подтверждает ли их порядок оборот Росстата сверх экономики места и сдвигаются ли МО между типами за год?"
    point_1: [T1_ladder_external, T5_trivial]   # тексты подряд, каждый — отдельное предложение. T1 (b) и T5 (3) —
                            # одно свидетельство (одни показатели, страты и соперники): в отчёте считаются одним
    t1_cap_by_t5: {not_repeats: partial_overall, not_empty: partial_overall}   # при таком вердикте T5 текст T1 — не
                            # выше partial_overall: «сверх экономики места» не утверждается, если его не подтвердил и T5 (3)
    point_2: [T3_reliable_placebo, T2_direction]   # T2 — с place_override при place_cap
    point_3: [T7_utility]   # с текстом type_gain
    caveat: [T6_bank_coverage]   # отдельной строкой сразу после трёх пунктов, при любом исходе
    excluded: [T4_basket_vs_place, profile, tree, examples, controls]   # описания в главный вывод не входят
  posthoc: "расчёты вне T1–T7, контролей и R1 (например, ε² инвестиций и отгрузки по типам) — только в раздел «Разведка после регистрации» docs/interpretation.md с пометкой; в главный вывод, названия и лендинг не идут"
  federal_districts:        # T5: регион -> федеральный округ. Источник: Указ Президента РФ от 13.05.2000 № 849
                            # «О полномочном представителе Президента Российской Федерации в федеральном округе»,
                            # перечень федеральных округов, ред. от 26.06.2023 (http://www.kremlin.ru/acts/bank/15492).
                            # Коды — territories.region_code (int); здесь 77 регионов с тратами, без 8 отсутствующих
                            # в данных (ловушка 16). Узел-город — по своему коду (77 — ЦФО, 78 — СЗФО)
    central: [33, 37, 40, 44, 48, 50, 57, 62, 67, 68, 69, 71, 76, 77]
    northwestern: [10, 11, 29, 35, 39, 47, 51, 53, 60, 78, 83]
    southern: [1, 8, 30, 34]
    north_caucasian: [5, 6, 7, 9, 15, 20, 26]
    volga: [2, 12, 13, 16, 18, 21, 43, 52, 56, 58, 59, 63, 64, 73]
    ural: [45, 66, 72, 74, 86, 89]
    siberian: [4, 17, 19, 22, 24, 38, 42, 54, 55, 70]
    far_eastern: [3, 14, 25, 27, 28, 41, 49, 65, 75, 79, 87]
  report: docs/interpretation.md   # отчёт этапа (собирается кодом, руками не править)
  report_images: docs/img/interpret

# РАЗВЕДКА ПОСЛЕ ВСКРЫТИЯ. Записано 01.10.2026 отдельным коммитом ДО первого расчёта: этап `python -m munnet usefulness`,
# код — src/munnet/usefulness.py, выходы — <paths.outputs>/usefulness/. Это не проверка тезиса и не часть предрегистрации
# этапа 5: вердикты, тексты исходов и заголовки сайта не меняются. Описательные результаты для блока «чем полезно»
# (замечание судьи критерия 5, 30.09): (1) в какой доле случаев сверка изменения розничного оборота с соседями
# по своему региону ошибается меньше, чем сверка с похожими по тратам МО других регионов, и пример, выбранный
# правилом; (2) флаг устойчивости типа МО. Черновик блока разобрал devils-advocate (01.10, до расчёта): правки
# внесены — что меняется в уже опубликованных текстах при каждом исходе, полный seen_before, слова для выигрыша,
# набор R (случайные МО своего региона), правило для узлов-городов, процентили ошибок примера.
# Любой исход публикуется; не понравился исход — меняется текст по edits ниже, а не правило.
usefulness:
  seen_before:              # что было известно при записи (facts.json этапа 5, docs/interpretation.md, отчёт, сайт)
    - "медианные ошибки по цели без поправки на регион (target_abs), 1542 МО: соседи по региону B 0,036, похожие по тратам D 0,042, случайные того же размера C 0,038; разность медиан B − D −0,005 (95% интервал −0,009…−0,003 — бутстрап по МО, не по группам региона)"
    - "медианные ошибки по цели относительно региона (target): A 0,048, B 0,036, C 0,045, D 0,050; B − D −0,013 (−0,017…−0,010); D − A +0,001 (0,000…0,003); ошибка B в обеих целях одна и та же"
    - "доля различий изменения розницы, объяснённая группой региона (post_unsealing.t7_region, η², 66 групп): 0,218 по цели без поправки, 0,524 по цели относительно региона"
    - "пример этапа 5 (T7 example, median_error_product) — Благовещенский район: по цели относительно региона соседи по региону ошибаются больше похожих по тратам (0,058 против 0,050); его ошибки по target_abs не смотрели"
    - "доля узлов с тем же типом по вариантам R1: другое правило рёбер 46,9%, районы Москвы и Петербурга отдельно 54,1%, без признака уровня трат 99,8%; ARI вариантов с основным расчётом 0,22; 1,00; 0,32; AMI типов с делением по уровню трат в прогонах R1: seed 142, 242, 342, 442 — по 0,31, косинус корзин 0,23, без уровня трат 0,31, районы отдельно 0,25 (AMI по seed частично предсказывает долю «тот же тип во всех повторах»)"
    - "не смотрели: поэлементные разности ошибок B и D, их медиану, знак у отдельных МО и любые доли по МО; ошибки случайных МО своего региона (набор R ниже — новый); долю узлов с тем же типом во всех повторах seed; совместное распределение вариантов и повторов по узлам"
  rule_share:
    source: outputs/interpret/t7_errors.csv   # ошибки МО этапа 5; только common = True (общий набор T7, 1542 МО)
    target: target_abs      # ошибки err_abs_*: цель без поправки на регион. Ошибка B в обеих целях одна и та же:
                            # члены B — из той же группы региона, медиана региона сокращается. У D по цели
                            # относительно региона к ошибке добавляется разность медиан двух регионов, и разрыв B − D
                            # там больше (−0,013 против −0,005, см. seen_before). Поэтому доля считается по target_abs —
                            # для правила это строже
    rule_set: B             # соседи по своему региону: до 10 ближайших МО своей группы региона (T7, набор B)
    against: D              # главное сравнение: похожие по тратам МО других регионов (набор продукта T7)
    also_against: [C, R]    # описание рядом: C — случайные МО того же дециля населения из других регионов (этап 5);
                            # R — новый набор: случайные МО своей группы региона с известной целью (без самого МО),
                            # столько же, сколько членов у B этого МО, 100 розыгрышей; ошибка МО — медиана по розыгрышам
                            # (как у C). R отвечает, важны ли ближайшие соседи или достаточно своего региона
    random_draws: 100
    groups: region_group    # группа региона — как interpret.tests.T7_utility.other_regions (features_nodes.region_group;
                            # Москва с Московской областью, Петербург с Ленинградской — одна группа); число групп публикуется
    works: strict_less      # «сработало» у МО: err_abs_B < err_abs_D; равенства считаются отдельно
    share: works_over_n     # доля = сработало / n, n — все МО общего набора (равенства — в знаменателе)
    delta: 0.01             # описание рядом: B точнее больше чем на δ / в пределах δ / D точнее больше чем на δ
                            # (единицы цели — разность логарифмов, 0,01 ≈ 1% изменения оборота); почти ничьи — не победы
    bootstrap: 2000         # интервалы — бутстрап по группам региона (все МО группы целиком, с возвращением): ошибки МО
                            # одного региона зависимы, у них общие соседи. Зависимость через общих членов D из чужих
                            # регионов не учитывается (оговорка в тексте). Генератор — свой default_rng(seed) на каждый
                            # бутстрап. Интервал по группам в тексте не сравнивается с интервалом T7 по МО
    ci_level: 0.95
    words:                  # слова о доле — по интервалу, не по точке; те же пороги для C, R и долей по типам
      more_often: "чаще, чем нет"            # нижняя граница интервала доли выше 0,5
      about_half: "примерно в половине случаев"   # интервал содержит 0,5
      less_often: "реже, чем нет"            # верхняя граница ниже 0,5
    reference_always: "при равной точности было бы 50%"   # слова — всегда с долей, интервалом и этим ориентиром;
                            # формулировка «в X% случаев», а не «работает у X% МО»; сравнительных слов между типами нет
    gain: median_paired     # медиана d = err_abs_B − err_abs_D по МО, с тем же бутстрап-интервалом; в тексте не ставится
                            # рядом с разностью медиан −0,005 как одна величина
    gain_words:
      b_better: "у типичного МО соседи по региону ближе"      # верхняя граница интервала медианы d ниже 0
      no_difference: "у типичного МО разницы нет"            # интервал содержит 0
      d_better: "у типичного МО похожие по тратам ближе"     # нижняя граница выше 0
    edits:                  # что меняется в уже опубликованных текстах (report.md §1 и §8, лендинг «Что с этим делать»,
                            # карточка) по слову доли B против D; слово по R меняет вторую часть
      more_often: "фраза «ориентир лучше» остаётся; рядом — доля, интервал и ориентир 50%"
      about_half: "«ориентир лучше» → «в медиане по всем МО ошибка меньше, но у отдельного МО соседи по региону ближе примерно в половине случаев»"
      less_often: "«ориентир лучше» снимается: «медианная ошибка меньше, но в большинстве случаев похожие по тратам МО других регионов ближе»"
      vs_R_not_more_often: "если доля B против R не «чаще, чем нет», совет пишется «сверяйте со своим регионом», а не «с соседями»: расстояние внутри региона не утверждается"
    per_mo: not_shown       # знак d у отдельного МО — шум одного года, не свойство МО: в карточке не показывается
    by_type: true           # доля по итоговым типам (outputs/interpret/types.csv) — описание, различия не проверяются
    qc_recompute: 1.0e-12   # ошибки B и D пересчитываются заново: цель — log1p(retail_pc) 2024 минус 2023
                            # (data/processed/context_annual.parquet), наборы — outputs/interpret/node_comparable.csv
                            # (B — соседи по региону, D — набор продукта); расхождение с t7_errors.csv больше допуска,
                            # другое число МО или медианы, не равные facts.t7.median_error_abs, — код 3
  example:                  # пример пользы для отчёта и лендинга
    rule: median_paired_diff   # МО общего набора, у которого d ближе всего к медиане d по всем МО; при равенстве —
                            # меньший territory_id. Типичный случай по разности, а не лучший: знак d — каким выйдет
    show: [own_change, median_B, median_D, err_B, err_D, err_percentiles, members_B]   # изменение розничного оборота
                            # на жителя у МО и медианы изменения у соседей по региону и у похожих по тратам (в процентах:
                            # exp − 1), ошибки и их процентили среди всех МО общего набора (типичен ли пример и по уровню
                            # ошибок), соседи по региону с км; регион указывается всегда
    keep: interpret.tests.T7_utility.example   # пример этапа 5 (Благовещенский район) остаётся рядом; его ошибки
                            # показываются по той же цели target_abs, с пометкой, что на странице главы 6 — цель
                            # относительно региона
  type_flag:                # флаг устойчивости типа МО: outputs/interpret/node_seed.csv и node_r1.csv (тот же тип
                            # в вариантах R1 — kind = variant — и в 4 повторах с другим seed, seed 42 — основной расчёт
                            # и в повторы не входит); только узлы с типом (outputs/interpret/types.csv)
    variants: 3             # interpret.robustness.variants
    seeds: 4                # interpret.robustness.seeds без основного
    stable: all_runs        # «тип устойчив» — узел есть во всех 3 вариантах и 4 повторах и везде тот же тип;
                            # тот же тип везде, где узел есть, но вариантов меньше 3 (Москва и Петербург: варианта
                            # «районы отдельно» у них нет) — «проверен в N из 3 вариантов»; иначе — «тип зависит
                            # от варианта расчёта»
    also: majority          # описание рядом, не флаг: тот же тип во всех повторах и больше чем в половине вариантов
    breakdown: [seeds_only, per_variant, all]   # доля «тот же тип» только по повторам, по каждому варианту и по всем
                            # вместе — флаг почти целиком определяет вариант с другим правилом рёбер
    by_type: true
    label: "описание, не проверка"   # подпись флага везде; корень «надёжн» не используется (он — только при вердиктах T3)
    display: separate_counts   # в карточке счёт вариантов и повторов по-прежнему раздельно
                            # (site.always.mo_stability.separate); флаг — слово рядом с ними, не «N из 8»; новый элемент
                            # карточки сверх site.always — запись в журнале docs/landing_spec.md §4.3
  # ПРЕДРЕГИСТРАЦИЯ 01.10.2026, отдельным коммитом ДО расчёта на новых целях (решение участника 01.10 после
  # повторной оценки судьи критерия 5): зависит ли польза сверки со своим регионом от типа МО. Черновик —
  # expert-economist, два круга devils-advocate, правки приняты. Ошибки наборов B, D, R по обороту общепита, доходу
  # 5-НДФЛ и отгрузке не считались, изменения этих показателей 2023 → 2024 не открывались; смотрели только покрытие
  # и уже виденную розницу. Если проверка не подтвердится, меняется текст, а не проверка; правки после коммита —
  # только с записью «было → стало» и причиной.
  by_type_test:
    question: "Зависит ли польза сверки изменения экономики МО со своим регионом от типа МО: у городских типов 3 и 4 соседи по региону ближе похожих по тратам МО других регионов реже, чем у типов 1 и 2?"
    hypothesis: "У типов 3–4 (выше доля кафе и ресторанов в тратах относительно региона, крупнее) доля случаев «соседи по региону ближе похожих по тратам» меньше, чем у типов 1–2. Предполагаемый механизм (не проверяется): соседи по региону у городов — в основном МО других типов, а похожие по тратам МО других регионов — того же типа"
    born_from: "доли «B ближе D» по рознице по типам (seen_before): 59,0%, 60,8%, 50,3%, 53,2% — гипотеза родилась из них, поэтому розница — источник, а не проверка"
    seen_before:              # что было известно при записи; всё по рознице — виденная цель
      - "выбор решающей статистики (среднее по трём целям, страты статуса МО, правило устойчивости) сделан по мощности на виденной рознице; значения новых целей не открывались, изменения дохода 5-НДФЛ и отгрузки 2023 → 2024 никто в проекте не смотрел"
      - "usefulness (розница, target_abs, 1542 МО, 58 групп региона): B ближе D в 882 случаях — 57,2% (54,7–59,7%); B ближе C — 57,9%; B ближе R — 52,5% (50,1–55,0%), 11 равенств; медианные ошибки B 0,036, D 0,042, C 0,038, R 0,035; медиана d = err_B − err_D −0,0053 (−0,0083…−0,0035)"
      - "розница по типам, доля «B ближе D» (счётчики usefulness rule.by_type): тип 1 — 409 из 693 (59,0%), тип 2 — 250 из 411 (60,8%), тип 3 — 173 из 344 (50,3%), тип 4 — 50 из 94 (53,2%); {3,4} — 223 из 438, {1,2} — 659 из 1104, Δ = 223/438 − 659/1104 = −0,08779"
      - "розница на всех 1542 МО (бутстрап по группам региона 2000, seed 42): Δ −0,088 (−0,149…−0,023); перестановки типов внутри групп региона — среднее нуля −0,004, SD 0,027, односторонний p 0,002; разность медиан d +0,0068 (+0,0023…+0,0115)"
      - "розница на покрытиях новых целей (те же МО, что войдут в расчёт): общепит (828 МО) −0,069 (−0,154…+0,023; у devils-advocate верхняя граница +0,020 — другой порядок генератора) — по правилу этого блока было бы not; доход 5-НДФЛ (1231) −0,085 (−0,160…−0,005); отгрузка (1541) −0,088 (−0,150…−0,023); среднее по трём −0,081 (−0,151…−0,006), нуль перестановок −0,004 (SD 0,029), p 0,005; бутстрап-оценки Δ трёх покрытий на одной рознице коррелируют 0,76–0,94"
      - "розница, среднее по трём покрытиям по прогонам R1 (seen_retail3.py, 1000 бутстрапов и перестановок, интервал с поправкой центра): основной расчёт −0,081 (−0,148…−0,003), p 0,005 — confirmed; 4 повтора seed — те же метки, что основной (тип по повторам совпадает у 100% узлов), тот же исход; без уровня трат −0,083 (−0,151…−0,007) — confirmed; другое правило рёбер −0,054 (−0,112…+0,008), p 0,012 — not; районы Москвы и Петербурга отдельно −0,039 (−0,106…+0,034), p 0,062 — not. Наименьший вердикт по рознице — not: по правилу lowest_verdict не прошла бы и цель, из которой гипотеза родилась"
      - "розница по статусу МО: внутри городских округов {3,4} 48,7% (226 МО) против {1,2} 58,0% (162); среди остальных МО 53,3% (212) против 60,0% (942); Δ типов внутри статуса (страты go / не go, гармонические веса) −0,076 (−0,139…−0,009), с тремя стратами go / mo / mr −0,077 (−0,141…−0,010); среднее по трём покрытиям внутри статуса −0,068 (−0,139…+0,004), p перестановок 0,014; деление «mo_type == go / остальные» −0,062 (−0,134…+0,001); Δ_type − Δ_go −0,026 (−0,084…+0,046)"
      - "розница, доли «B ближе R» по типам 52,4 / 51,1 / 55,2 / 50,0%, «B ближе C» — 60,8 / 57,9 / 54,9 / 48,9%; медиана d по типам −0,0078 / −0,0068 / −0,0005 / −0,0011; доли «B ближе D» по типам на покрытии общепита 57,4 / 65,8 / 52,5 / 54,3%"
      - "розница, шум по группам: MAD × 1,4826 изменения {3,4} 0,047, {1,2} 0,060; медианы err_B 0,033 и 0,037, err_D 0,035 и 0,045 (отношение {1,2}/{3,4} 1,14 и 1,32, {3,4}/{1,2} меньше 1 — оба флага шума не сработали бы); равенств err_B = err_D нет"
      - "без целей (составы наборов и типы): доля членов B того же типа — 45,9 / 28,6 / 26,5 / 10,3% (типы 1–4), членов D того же типа — 82,9 / 78,6 / 82,1 / 80,3%; доля членов B из типов 3–4 — 29,8 / 28,4 / 34,9 / 39,9%, членов D — 6,1 / 0,0 / 85,9 / 99,9%. Низкая доля «своих» в B у типа 2 (28,6%) при самой высокой доле «B ближе D» по рознице — механизм «соседи другого типа» сам по себе гипотезу не объясняет"
      - "флаг устойчивости типа (usefulness.type_flag): тип устойчив у 32,5% узлов; по типам 1–4 — 7,8 / 62,6 / 30,5 / 96,1%. Деление {3,4} / {1,2} на 1542 МО совпадает с основным расчётом: другое правило рёбер — 83,3%, без уровня трат — 99,9%, районы отдельно — 91,8%, во всех трёх — 80,5%; при другом правиле рёбер 256 из 693 МО типа 1 переходят в типы 3–4"
      - "общепит Росстата: уровень 2023 года по типам видели в T1, t5.per.catering, t4.basket_only_rho_b.catering, t1_regions_up.catering; изменение log1p_rel 2023 → 2024 — в T6 только у МО потоков 1 → 3 и 2 → 1 и оставшихся типов 1 и 2 (outputs/interpret/t6_flows.csv): медианы перешедших 0,038 и 0,015, оставшихся 0,028 и −0,005, δ Клиффа по потокам −0,039 и +0,041, общая δ −0,015, вердикт not; отношение медиан 2,11 в §7 отчёта — о доле общепита в тратах банка, не о Росстате. Ошибки сверки по общепиту и его изменения у типов 3 и 4 не смотрели"
      - "доход 5-НДФЛ: уровень по типам видели — t6.coverage_eps2 0,082 (ε² log_level_rel − log_ndfl_rel по типам, 1562 узла, place_year); log_ndfl_rel — проверочный признак network.attributes.check (ассортативность сети, этап 2); сюжет С6 разведки (траты к доходу 5-НДФЛ, docs/eda.md); уровень — во внешней проверке этапа 3. Изменение 2023 → 2024 не смотрели"
      - "маски пропусков: общепит, отгрузка и доход 5-НДФЛ 2023 года входят в coverage_class T5 (число пропусков по 11 показателям, interpret.place_partitions) — известно, у кого показатель есть, но не его значения и не изменения"
      - "покрытие (без значений): оба года в context_annual — общепит 1203 МО, доход 5-НДФЛ (ndfl_ok в оба года) 1541, отгрузка 1786; в общем наборе T7 после min_set для B и D — 828 / 1231 / 1541; по типам 1–4: общепит 383 / 158 / 217 / 70, доход 547 / 328 / 280 / 76, отгрузка 692 / 411 / 344 / 94; общепит по статусу: ГО 155 / 86, остальные 132 / 455 ({3,4} / {1,2}); медианный размер наборов B и D по общепиту — 8 и 7 (по рознице 10 и 10). В общем наборе T7 нет узлов-городов и внутригородских территорий: статусы только go, mo, mr"
      - "грубая мощность — в power ниже"
    targets:                  # три новые цели; решает среднее, каждая отдельно — описание
      catering:
        source: context_annual.catering_turnover_pc   # оборот общепита Росстата на жителя, без МСП
        caveat: "вывод — о МО, где оборот общепита публикуется (828 из 1542; у сельского типа 2 — 158 из 411)"
      ndfl:
        source: context_annual.ndfl_income_pc   # доход 5-НДФЛ на жителя (ФНС): с малым бизнесом, по месту работодателя
        filter: ndfl_ok_both_years
      shipments:
        source: context_annual.shipments_pc     # отгрузка Росстата на жителя, без МСП; скачки от отдельных предприятий
      transform: log1p        # как interpret.tests.T7_utility.target_abs: ln(1 + x) 2024 минус 2023, без поправки
      change: diff            # на регион
      retail_seen: show       # розница — рядом с пометкой «виденная цель, источник гипотезы», та же статистика
      why: "Общепит — ближайший к оси типов показатель вне построения (ось — доля кафе в тратах); доход 5-НДФЛ — соседняя ось (уровень трат и зарплата) и единственный показатель с малым бизнесом; отгрузка — далека от оси потребления, но с полным покрытием. Ни один не входит в X и G; сверку B/D по ним не считали. Одна цель мощности не даёт: на покрытии общепита даже виденная розница дала бы not (seen_before)"
    universe:
      base: outputs/interpret/t7_errors.csv   # МО общего набора T7 (common = True, 1542 МО)
      target_known: both_years                # для каждой цели — свой набор МО
      members: outputs/interpret/node_comparable.csv   # составы B и D те же; член учитывается, только если его цель
                              # известна в оба года (как usefulness.set_medians)
      min_set: 5              # interpret.tests.T7_utility.min_set: у B или D меньше 5 членов с известной целью — МО
                              # выбывает из этой цели; число выбывших публикуется по целям и типам
      R: {pool: region_group_known_target, size: known_B_size, draws: 100}   # как usefulness.rule_share
      types: outputs/interpret/types.csv      # итоговые типы, как usefulness.rule_share.by_type
      groups: {high: [3, 4], low: [1, 2]}
      status: {source: features_nodes.mo_type, strata: {go: [go], other: [mo, mr]}}   # «городской округ» /
                              # «остальные МО (районы и муниципальные округа)»; почему две страты — note.md
    statistic:
      works: strict_less      # «B ближе D» у МО: err_B < err_D (как usefulness); равенства — в знаменателе
      per_target: share_diff  # Δ_t = доля «B ближе D» в {3,4} минус доля в {1,2} на МО цели t; доля группы — общая
                              # по всем её МО (сработало / n группы), без весов населения
      main: mean_of_three     # РЕШАЕТ: Δ = (Δ_catering + Δ_ndfl + Δ_shipments) / 3; гипотеза — Δ < 0
      within_status:          # Δ_status: по каждой цели Σ_s h_s·(доля{3,4}_s − доля{1,2}_s) / Σ_s h_s, затем среднее
        weights: harmonic     # по трём целям; h_s = n_a·n_b / (n_a + n_b); страта без одной из групп в выборке — h_s = 0
      rival: {name: 'mo_type == "go"', statistic: share_diff}   # Δ_go = доля «B ближе D» у ГО минус у остальных,
                              # среднее по трём целям; публикуется при любом исходе
      share_hi: mean_of_three # доля «B ближе D» у {3,4}, усреднённая по трём целям, с интервалом того же бутстрапа
      describe:               # описание по каждой цели и группе, без слов вердикта
        - share_by_type       # доли «B ближе D» по 4 типам с интервалом
        - per_target_delta    # Δ_t и Δ_t внутри статуса с интервалами
        - median_d_diff       # медиана d в {3,4} минус в {1,2}, единицы цели
        - vs_R                # доли «B ближе R» и «R ближе D» по группам
        - noise               # MAD × 1,4826 изменения цели, медианы err_B и err_D, число равенств err_B = err_D
        - set_sizes           # медианный размер B и D (члены с известной целью) по группам и целям
      noise_flag_lo: 1.5      # у {1,2} медиана err_B или err_D больше 1,5 × медианы у {3,4} хотя бы по одной цели —
                              # к исходам not и reverse оговорка noise_caveat_lo с перечнем целей
      noise_flag_hi: 1.5      # у {3,4} медиана err_B или err_D больше 1,5 × медианы у {1,2} хотя бы по одной цели —
                              # к исходу confirmed оговорка noise_caveat_hi с перечнем целей
      bootstrap:
        n: 2000               # общий бутстрап по группам региона: одна выборка групп на все три цели и на Δ, Δ_status,
        by: region_group      # Δ_go, share_hi; свой default_rng(seed)
        empty_group: drop     # выборка, где у какой-либо цели пуста одна из групп {3,4} / {1,2}, отбрасывается;
                              # число отброшенных публикуется
      ci_level: 0.95          # двусторонний перцентильный интервал: нужен исход reverse
      permutation:            # отрицательный контроль: метки типов перемешиваются внутри групп региона, одна перестановка
        within: region_group  # на все три цели (одни и те же метки), 2000 раз, свой default_rng(seed); по той же
        n: 2000               # перестановке считаются нули Δ и Δ_status
        alpha: 0.05
        p_less: "(#{Δ_perm ≤ Δ} + 1) / (n + 1)"      # для confirmed
        p_greater: "(#{Δ_perm ≥ Δ} + 1) / (n + 1)"   # для reverse
        center: worst_for_hypothesis   # m0 — среднее нуля. Интервал для вердикта и для {ci}: верхняя граница =
                              # max(U, U − m0), нижняя = min(L, L − m0) — поправка только расширяет; для {ci_status} —
                              # то же со средним нуля Δ_status
      mde: "2,80 × SD бутстрапа Δ + max(0, −m0)"   # {mde} — по модулю, в п. п.; на настоящих целях
    rule:
      levels: [reverse, not, confirmed]
      confirmed: "верхняя граница интервала Δ с поправкой центра < 0 и p_less < alpha"
      reverse: "нижняя граница интервала Δ с поправкой центра > 0 и p_greater < alpha"
      not: "иначе"
      robustness:             # как interpret.robustness.main_text
        required: lowest_verdict   # вердикт по тому же правилу считается в основном расчёте, в каждом из 3 вариантов
                              # (node_r1.csv, kind == "variant") и в 4 повторах seed (kind == "seed"); группы {3,4} /
                              # {1,2} — по matched_type прогона; бутстрап и перестановки — те же генераторы. В главный
                              # текст — наименьший вердикт по порядку levels (reverse < not < confirmed), числа — из
                              # прогона, давшего его (при равенстве — основной, затем порядок variants, seeds); все 8
                              # вердиктов публикуются в §8. Основной выше наименьшего — текст unstable в раздел проверки
      beyond_status:          # уточнение слов при confirmed, не условие вердикта
        statistic: within_status   # Δ_status (среднее по трём целям), интервал с поправкой центра по нулю Δ_status
        adds: upper_lt_0      # верхняя граница < 0 — status_adds; иначе — status_same
      go_below: "верхняя граница интервала Δ_go < 0 (без поправки центра)"   # условие для not_go_below и для подписи
                              # про ГО в status_same; при выполнении not_go_below заменяет go_always
      share_hi_more_often: "нижняя граница 95% интервала share_hi (тот же бутстрап) > 0,5"   # при confirmed перекрывает
                              # edits.confirmed.status_adds и status_same: совет не уточняется типом
      multiplicity: "решает одна статистика (среднее по трём целям); Δ_status и Δ_go — уточнения слов, не отдельные проверки; отдельные цели — описание без слов «подтвержд», «видно», «различа», поэтому поправки нет"
    power:                    # грубо, по виденной рознице на масках покрытия трёх целей, нормальное приближение,
