    # Каждый сохраняется как data/raw/bdmo/<код показателя>.csv.gz; sha256 — сжатого потока.
    kind: zip_members
    base_url: https://storage.yandexcloud.net/tochno-st-catalog/Rosstat/data_bdmo_118_v20250918/by_indicator/
