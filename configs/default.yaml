      anchor: 0.02          # привязка круга к исходному центру региона, доля за итерацию
      attract: 0.2          # стягивание соседей по Делоне до касания, доля зазора за итерацию
      max_edge_km: 2500     # соседи по Делоне дальше — не стягиваются
      radius_factor: 0.95   # круги чуть меньше площади — регионы смыкаются без щелей
      size: 6               # сторона ячейки на странице, единиц SVG
      margin: 12            # поля холста SVG, единиц
