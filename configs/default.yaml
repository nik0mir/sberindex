    out: site               # каталог страницы для GitHub Pages (относительно корня репозитория)
    dev_blind_out: outputs/site_dev_blind   # site --dev-blind <каталог interpret_blind>: только сюда, с плашкой
                            # «СЛЕПОЙ ПРОГОН» из facts.label; в site/ слепые выходы не попадают никогда (иначе код 3)
